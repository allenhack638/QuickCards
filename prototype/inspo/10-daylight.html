<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickCards · Daylight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DAYLIGHT TOKENS. Every value below is a token; nothing outside this
   block may use a literal font-size, spacing or radius.
   ===================================================================== */
:root{
  /* type: five sizes, five line heights (Compose: labelSmall, bodyMedium, bodyLarge, titleLarge, headlineSmall) */
  --f1:11px; --f2:13px; --f3:15px; --f4:20px; --f5:24px;
  --lh1:16px; --lh2:20px; --lh3:20px; --lh4:28px; --lh5:32px;
  --w-regular:400; --w-medium:500; --w-semibold:600;
  --sans:"Geist",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,monospace;
  --track-num:.04em; --track-dots:.12em; --track-title:-.02em;

  /* spacing: 4px grid */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px;

  /* radii: one scale */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px; --r-frame:36px; --r-full:999px;

  /* sizes (dp) */
  --hit:48px; --ctl-sm:24px; --ctl:32px; --ctl-md:36px; --ctl-lg:44px; --field:48px;
  --ic-xs:16px; --ic-sm:18px; --ic:20px; --ic-lg:24px;
  --bar:64px; --row:56px; --row-2:64px; --nav-h:80px; --sb-h:32px;
  --phone-w:360px; --phone-h:780px; --art-w:328px; --hero-h:207px;
  --mini-w:40px; --mini-h:26px; --mark-w:56px; --mark-h:28px;
  --icon-inset:2px;   /* Material Symbols live area: 20 inside the 24 box; optical keyline for labels that align to icons */

  /* motion: three durations only */
  --dur-state:150ms; --dur-nav:200ms; --dur-toast:3000ms;
  --ease:cubic-bezier(.2,0,0,1);

  /* on-art status tone (same in both themes; art is theme-independent): the expired date; >=7:1 on every pixel behind it (stripes masked + shade, Round 6) */
  --on-art-danger:#FFCBC2;
  /* Round 7 (AUDIT6 P1-1): the ONE status chip fill on art (Expires soon, Check, Archived, Expired). White f1 text on it is >=7:1 on every
     pixel of all 16 bands incl. graphite, measured from rendered pixels with the glyphs hidden (tools/r8/chip.mjs). "Last used" and the archive reason (.quiet) share the fill, without the ring, at 500 */
  --on-art-chip:rgba(0,0,0,.30);
}
/* light (default) */
:root,[data-theme="light"]{
  --backdrop:#E6EAF0;      /* page behind the phones (not an app colour) */
  --bg:#F4F6F9;            /* app background */
  --surface:#FFFFFF;       /* groups, fields, details rows */
  --surface-hi:#FFFFFF;    /* sheets, dialogs, menus (lifted by shadow) */
  --tonal:#EEF1F5;         /* tonal buttons, copy discs, chips */
  --tonal-2:#E3E7ED;       /* pressed / selected tonal */
  --tonal-hi:#EEF1F5; --tonal-hi-2:#E3E7ED;   /* tonal on raised surfaces (sheet, dialog, menu) */
  --line:#E3E7ED;          /* hairlines */
  --outline:#7A8392;       /* field and control borders (3:1) */
  --ink:#0D1117;           /* primary text and icons */
  --ink-2:#4F5866;         /* secondary text and icons */
  --ink-3:#9AA1AC;         /* disabled (exempt from contrast) */
  --ink-ph:#6B7482;        /* placeholder text (>=4.5:1 on surface) */
  --accent:#1F4FE0;        /* text buttons, links, caret, focus */
  --brand:#C8202B; --on-brand:#FFFFFF;   /* the one filled CTA per screen */
  --danger:#B42318; --danger-bg:#FCEDEB; --on-danger:#FFFFFF;
  --ok:#1B7F4B; --warn:#9A5B00;
  --select:#0D1117; --on-select:#FFFFFF; /* switch on, checkbox, radio, selected chip */
  --inverse:#151A22; --on-inverse:#F2F4F7; --on-inverse-2:#AEB6C2; --inverse-accent:#A9BFFF; --inverse-danger:#FFB4A8;
  --inverse-tint:rgba(255,255,255,.08);  /* icon disc + pressed action on the toast */
  --scrim:rgba(13,17,23,.36);
  --state:rgba(13,17,23,.08);            /* pressed state layer */
  --e1:0 1px 2px rgba(13,17,23,.05),0 0 0 1px var(--line);
  --e2:0 8px 24px -8px rgba(24,36,64,.24),0 2px 6px rgba(24,36,64,.08),0 0 0 1px rgba(13,17,23,.04);
  --e3:0 24px 48px -16px rgba(24,36,64,.30),0 4px 12px rgba(24,36,64,.08);
  --e-phone:0 1px 0 #fff inset,0 24px 48px -16px rgba(24,36,64,.22),0 4px 12px rgba(24,36,64,.06);
  --phone-edge:rgba(13,17,23,.06);
  --handle:rgba(13,17,23,.28);
  --selection:#C9D6FF;
  color-scheme:light;
}
[data-theme="dark"]{
  --backdrop:#050608;
  --bg:#0B0D11;
  --surface:#14171D;
  --surface-hi:#1A1E25;
  --tonal:#1C2028;
  --tonal-2:#262B34;
  --tonal-hi:#2A2F39; --tonal-hi-2:#343A45;   /* steps up one level on surface-hi */
  --line:#232831;
  --outline:#6B7482;
  --ink:#F2F4F7;
  --ink-2:#9AA3B0;
  --ink-3:#4F5764;
  --ink-ph:#808895;
  --accent:#8FAEFF;
  --brand:#C8202B; --on-brand:#FFFFFF;
  --danger:#FF8A7A; --danger-bg:#3A1714; --on-danger:#1A0503;
  --ok:#6FD3A0; --warn:#F2B45C;
  --select:#F2F4F7; --on-select:#0B0D11;
  --inverse:#E6E9EE; --on-inverse:#0D1117; --on-inverse-2:#4F5866; --inverse-accent:#1F4FE0; --inverse-danger:#B42318;   /* true inverse: light capsule */
  --inverse-tint:rgba(13,17,23,.06);
  --scrim:rgba(0,0,0,.6);
  --state:rgba(242,244,247,.10);
  --e1:0 0 0 1px var(--line);
  --e2:0 12px 32px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  --e3:0 24px 48px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);
  --e-phone:0 1px 0 rgba(255,255,255,.06) inset,0 24px 48px -16px rgba(0,0,0,.6);
  --phone-edge:rgba(255,255,255,.08);
  --handle:rgba(255,255,255,.32);
  --selection:#2B3A66;
  color-scheme:dark;
}

/* art glow: declared where --glow exists (a var() on :root would resolve against an undefined --glow and drop the shadow) */
.art,[style*="--glow"]{--art-shadow:0 16px 24px -12px var(--glow),0 2px 4px rgba(13,17,23,.10)}
[data-theme="dark"] .art,[data-theme="dark"] [style*="--glow"],[data-theme="dark"].art{--art-shadow:0 16px 32px -12px var(--glow),0 2px 4px rgba(0,0,0,.4)}

/* =====================================================================
   BASE + browser surfaces
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--backdrop);color:var(--ink);font-family:var(--sans);font-size:var(--f2);line-height:var(--lh2);-webkit-font-smoothing:antialiased;scroll-behavior:smooth;scroll-padding-top:var(--s16)}
body{background:var(--backdrop);min-height:100vh}
::selection{background:var(--selection);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{caret-color:var(--accent);min-width:0}
input::placeholder,textarea::placeholder{color:var(--ink-ph)}
/* Round 8 (owner 11): masked inputs (CVV, passwords, any PIN-like field) draw real bullets from Geist Mono (text-security disc), the same size and
   tracking as the masked digits elsewhere (.dots: mono 500, .12em); the placeholder is --ink-ph in the field's own face, never boxes.
   Compose: PasswordVisualTransformation('\u2022') + the Geist Mono text style */
input.tf-input[type="password"]{font-family:var(--mono);font-weight:var(--w-medium);-webkit-text-security:disc;letter-spacing:var(--track-dots)}
input.tf-input[type="password"]::placeholder{color:var(--ink-ph);letter-spacing:var(--track-num)}
input.tf-input[type="password"]:not(.num)::placeholder{font-family:var(--sans);font-weight:var(--w-regular);letter-spacing:0}
textarea.tf-input{resize:none;field-sizing:content;overflow:hidden;padding:var(--s3) 0;max-height:calc(var(--lh3) * 2 + var(--s6))}
.tf-box:has(textarea){min-height:var(--field)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
/* rows inside clipped containers draw the ring inside, following the container corners */
.group :focus-visible,.sheet .row:focus-visible,.dialog .row:focus-visible,.menu-item:focus-visible,.af-row:focus-visible{outline-offset:-2px;border-radius:0}
.group > :first-child:focus-visible{border-radius:var(--r-lg) var(--r-lg) 0 0}
.group > :last-child:focus-visible{border-radius:0 0 var(--r-lg) var(--r-lg)}
.group > :only-child:focus-visible{border-radius:var(--r-lg)}
.num,.mono{font-family:var(--mono);font-weight:var(--w-medium);font-variant-numeric:tabular-nums;letter-spacing:var(--track-num)}
.dots{letter-spacing:var(--track-dots);margin-right:var(--s1)}
.dots.solo{margin-right:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* reduced motion: keep the short opacity/colour crossfades, drop movement */
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2400ms!important}.view,.view.is-off,.view.is-back{transform:none!important}.sw::after{transition:none!important}}   /* Compose: honour ANIMATOR_DURATION_SCALE 0: crossfade or cut, never a slide */

/* icons: <svg class="ic"><use href="#i-name"/></svg> or <i class="ic" data-i="name"></i> (hydrated) */
.ic{width:var(--ic-lg);height:var(--ic-lg);flex:none;fill:currentColor;display:block}
.ic.sm,.ic-20{width:var(--ic);height:var(--ic)}
.ic.xs{width:var(--ic-sm);height:var(--ic-sm)}
i.ic{display:inline-block}

/* =====================================================================
   DOCUMENT CHROME (not app UI): slim top bar, section nav, sections
   ===================================================================== */
.topbar{position:sticky;top:0;z-index:50;height:var(--hit);display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);
  background:var(--backdrop);box-shadow:0 1px 0 var(--line)}
.topbar-name{font-size:var(--f2);font-weight:var(--w-semibold);white-space:nowrap}
.topbar-name span{color:var(--ink-2);font-weight:var(--w-medium)}
.secnav{flex:1;display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;min-width:0}
.secnav::-webkit-scrollbar{display:none}
.secnav a{flex:none;font-size:var(--f2);color:var(--ink-2);text-decoration:none;padding:0 var(--s2);line-height:var(--ctl);border-radius:var(--r-full)}
.secnav a:hover{color:var(--ink);background:var(--state)}
.doc{max-width:1200px;margin:0 auto;padding:var(--s6) var(--s4) var(--s16)}
.sec{padding-top:var(--s8)}
.sec + .sec{margin-top:var(--s8);box-shadow:0 -1px 0 var(--line)}
.sec-h{font-size:var(--f3);line-height:var(--lh3);font-weight:var(--w-semibold);margin-bottom:var(--s6)}
.shots{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s12) var(--s8)}
.shot{width:var(--phone-w)}
.shot figcaption{margin-top:var(--s3);text-align:center;font-size:var(--f2);color:var(--ink-2)}
/* ?shot=<id>: one phone, nothing else */
body.shot-mode{display:block;min-height:0;padding:var(--s10) 0 0 var(--s8)}
/* headless Chrome lays out at >=500px wide, so the phone is pinned left (32) to fit a 420x860 capture */
body.shot-mode .topbar{display:none}

/* =====================================================================
   PHONE FRAME. <div class="phone"> gets status bar + gesture handle
   injected. Put the screen inside <div class="app">. Overlays (scrim,
   sheet, dialog) go directly inside .phone, after .app.
   ===================================================================== */
.phone{width:var(--phone-w);height:var(--phone-h);border-radius:var(--r-frame);background:var(--bg);position:relative;overflow:hidden;isolation:isolate;
  box-shadow:var(--e-phone);outline:1px solid var(--phone-edge)}
.sb{position:relative;z-index:1;height:var(--sb-h);display:flex;align-items:center;justify-content:space-between;padding:0 var(--s6);font-size:var(--f2);font-weight:var(--w-medium);font-variant-numeric:tabular-nums}
.sb-sys{display:flex;gap:var(--s1);align-items:center}
.gh{position:absolute;z-index:40;left:50%;bottom:var(--s2);width:108px;height:var(--s1);transform:translateX(-50%);border-radius:var(--r-full);background:var(--handle);pointer-events:none}
.app{position:absolute;top:var(--sb-h);left:0;right:0;bottom:0;display:flex;flex-direction:column}
/* multi-view phones (interactive): .app.views > .view[data-view] ; .is-off hides */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:opacity var(--dur-nav) var(--ease),transform var(--dur-nav) var(--ease),visibility var(--dur-nav)}
.view.is-off{opacity:0;visibility:hidden;transform:translateX(var(--s4));pointer-events:none}
.view.is-back{transform:translateX(calc(-1 * var(--s4)))}
.content{flex:1;min-height:0;overflow:hidden;padding:0 var(--s4)}
.content.pad-top{padding-top:var(--s2)}
.content.col{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.details-stack{gap:var(--s6)}
.list{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s2) 0 var(--s8)}

/* =====================================================================
   TOP APP BAR. .appbar (top level, 24 title) | .appbar.nested (back + 20 title)
   Search: add .is-search -> title + actions hide, .search shows.
   ===================================================================== */
.appbar{flex:none;height:var(--bar);display:flex;align-items:center;gap:var(--s1);padding:0 var(--s1) 0 var(--s4)}
.appbar-title{flex:1;min-width:0;font-size:var(--f5);line-height:var(--lh5);font-weight:var(--w-semibold);letter-spacing:var(--track-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar.nested{padding-left:var(--s1)}
.appbar.nested .appbar-title{font-size:var(--f4);line-height:var(--lh4);font-weight:var(--w-semibold);letter-spacing:0}
.appbar-actions{display:flex;align-items:center}
.appbar .spacer{flex:1}
.search{display:none;flex:1;min-width:0;align-items:center;height:var(--s10);padding:0;border-radius:var(--r-full);background:var(--surface);box-shadow:var(--e1)}
.search input{flex:1;font-size:var(--f3);line-height:var(--lh3);color:var(--ink);background:none;border:0;outline:0;box-shadow:none;border-radius:0}
/* A: the inner input never draws a ring; the caret is the touch focus cue, keyboard focus rings the container */
.search input:focus-visible{outline:0}
[data-input="kbd"] .search:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.search input:placeholder-shown + [data-act="search-clear"]{visibility:hidden}
.appbar.is-search{padding:0 var(--s4)}
.appbar.is-search > :not(.search){display:none}
.appbar.is-search .search{display:flex}

/* =====================================================================
   ICON BUTTON. 48 hit, 40 visible state disc on press. .ibtn.tonal = 36 tonal disc.
   ===================================================================== */
.ibtn{position:relative;flex:none;width:var(--hit);height:var(--hit);display:grid;place-items:center;border-radius:var(--r-full);color:var(--ink)}
.ibtn::after{content:"";position:absolute;inset:var(--s1);border-radius:var(--r-full);background:var(--state);opacity:0;transition:opacity var(--dur-state)}
.ibtn:active::after,.ibtn.is-pressed::after{opacity:1}
.ibtn.muted{color:var(--ink-2)}
.ibtn:disabled,.ibtn.is-disabled{color:var(--ink-3);pointer-events:none}
.ibtn.tonal::before{content:"";position:absolute;width:var(--ctl-md);height:var(--ctl-md);border-radius:var(--r-full);background:var(--tonal)}
.ibtn.tonal .ic{position:relative;width:var(--ic-sm);height:var(--ic-sm)}
.ibtn.on-art{color:#fff}

/* =====================================================================
   CARD ART. <div class="art" data-hue="navy"> (or data-card="hdfc") ;
   layers (.art-bg, .art-pat, .art-grain) are injected by QC.hydrate().
   ===================================================================== */
.art{position:relative;border-radius:var(--r-lg);color:#fff;overflow:hidden;isolation:isolate;
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 -1px 0 rgba(0,0,0,.25) inset,var(--art-shadow)}
.art-bg{position:absolute;inset:0;z-index:-1;background:
   radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.20),rgba(255,255,255,0) 55%),
   linear-gradient(135deg,var(--c1),var(--c2))}
.art-pat{position:absolute;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center;
  -webkit-mask-image:linear-gradient(180deg,#000 40%,rgba(0,0,0,.5) 55%);mask-image:linear-gradient(180deg,#000 40%,rgba(0,0,0,.5) 55%)}
.art-grain{position:absolute;inset:0;z-index:-1;opacity:.14;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.hero > .art-pat{-webkit-mask-image:linear-gradient(180deg,#000 35%,rgba(0,0,0,.5) 50%,rgba(0,0,0,.25) 60%);mask-image:linear-gradient(180deg,#000 35%,rgba(0,0,0,.5) 50%,rgba(0,0,0,.25) 60%)}
.art .t2{color:rgba(255,255,255,.80)}               /* secondary text on art (>=4.5:1 on every hue) */
.art :focus-visible{outline-color:#fff}
.art.is-expired{filter:saturate(.2)}
/* mini art: 40x26 thumbnail for rows, sheets, toasts, pickers */
.mini{flex:none;width:var(--mini-w);height:var(--mini-h);border-radius:var(--r-xs);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 4px -1px var(--glow)}
.mini .net{position:absolute;right:var(--s1);bottom:0;width:20px;height:10px}

/* card tile (Home list) */
.tile{display:block;width:100%;text-align:left;padding:var(--s4);cursor:pointer}
.tile:has(> .tile-open:active) .art-bg,.tile.is-pressed .art-bg{filter:brightness(1.08)}
/* P2-4: the tile's open target is a full-bleed sibling button; Copy / Mark paid sit above it as their own buttons (no nested controls) */
.tile-open{position:absolute;inset:0;z-index:1;border-radius:inherit;cursor:pointer}
.tile-open:focus-visible{outline:0}
.tile:has(> .tile-open:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.tile .pill-copy,.tile .pill-act{z-index:2}
.tile-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.tile-top{align-items:flex-start}
/* header block: bank | mark on row 1, meta | status chip on row 2 (chip shares the meta line) */
.tile-head{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--s3);row-gap:var(--s1)}
.tile-head > .net{grid-column:2;grid-row:1;align-self:start;justify-self:end}
.tile-head > .tile-bank{grid-column:1;grid-row:1}
.tile-head > .tile-meta{grid-column:1;grid-row:2;margin-top:0;align-self:center}
.tile-head > .tile-flag{grid-column:2;grid-row:2;justify-self:end;align-self:center}
.tile-bank{display:flex;align-items:center;gap:var(--s1);min-width:0;font-size:var(--f3);line-height:var(--lh3);font-weight:var(--w-semibold);letter-spacing:-.01em}
.tile-bank > span,.tile-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-bank .ic{flex:none;width:var(--ic-xs);height:var(--ic-xs);opacity:.9}
.tile-meta{font-size:var(--f2);line-height:var(--lh2);margin-top:var(--s1)}
/* digits row: one line only; the Copy pill shares its centre line */
.tile-foot{margin-top:var(--s6);min-height:var(--ctl);flex-wrap:wrap;row-gap:var(--s2)}
.tile-foot > .pill-copy{margin-left:auto}   /* large font: pill wraps under the digits, right-aligned */
.tile-digits{flex:none;display:flex;align-items:baseline;white-space:nowrap}
.tile-num{font-size:var(--f4);line-height:var(--lh4)}
.tile-num .dots{opacity:.72;margin-right:var(--s2)}
.tile-exp{font-size:var(--f2);margin-left:var(--s3)}
.tile .net{margin:calc(-1 * var(--s1)) calc(-1 * var(--s1)) calc(-1 * var(--s1)) 0}
/* Round 8 (owner 5): ONE status chip for every status (Archived, Expired, Check, Expires soon, Last used, the archive reason): text only, never an
   icon; f1/600 white on --on-art-chip, 1dp white 30% ring, min 20 (the meta line), r-xs. ONE slot: row 2 of the header grid (the subtitle line),
   right-aligned and centred on that line; its right edge = the network mark's artwork right edge = the Copy pill's right edge (DOM, 0 px).
   One chip per pass, by priority Archived > Expired > Check > Expires soon > Last used (QC.flag). .quiet only marks Last used / reason for scripts */
.tile-flag{display:inline-flex;align-items:center;min-height:var(--lh2);padding:0 var(--s2);border-radius:var(--r-xs);font-size:var(--f1);line-height:var(--lh2);font-weight:var(--w-semibold);white-space:nowrap;color:#fff;background:var(--on-art-chip);box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
/* Round 8 (owner 1): the note on the pass (Settings › Notes on cards): body-small, white 80%, AT MOST 2 lines with an ellipsis, and nothing else
   (no More/Less, no expanded state). The full note lives only on Card details. It sits above the open target, so a 500 ms hold copies it
   ("Note copied") and a tap still opens the card. TalkBack reads the whole note. Compose: Text(maxLines = 2, overflow = TextOverflow.Ellipsis) */
.tile-note{position:relative;z-index:2;margin-top:var(--s2)}
.tile-note-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:var(--f2);line-height:var(--lh2);overflow-wrap:anywhere;cursor:pointer;border-radius:var(--r-xs)}
.tile-note-text.is-pressed{background:rgba(255,255,255,.10)}
.tile-note + .tile-foot{margin-top:var(--s4)}
/* pressed / long-press: a white 10% state layer over the art (Compose: indication on combinedClickable) */
.tile > .tile-open:active,.tile.is-pressed > .tile-open{background:rgba(255,255,255,.10)}
.is-expired-tile .tile-exp{color:var(--on-art-danger)}
/* AUDIT5 P3-3: the stripes fade out above the digits band of an expired pass, so the date sits on the plain graphite body (AAA, measured from pixels) */
.is-expired-tile > .art-pat{-webkit-mask-image:linear-gradient(180deg,#000 25%,transparent 55%);mask-image:linear-gradient(180deg,#000 25%,transparent 55%)}
.is-expired-tile > .art-bg{background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.24) 75%),
   radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.20),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--c1),var(--c2))}   /* a quiet shade under the digits band */
/* P1-1: the Expired chip text is white on a dark fill (>=7:1); the warning tone sits only on its 1dp ring and the date */
.is-expired-tile .tile-flag{color:#fff;background:var(--on-art-chip);box-shadow:0 0 0 1px var(--on-art-danger) inset}
/* bill-due strip: inset s2 from the card edge, so icon starts on the text column and the action ends on the Copy pill edge */
.tile-due{display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--s2);min-height:var(--hit);margin:var(--s6) calc(-1 * var(--s2)) calc(-1 * var(--s2));padding:0 var(--s2);border-radius:var(--r-md);
  background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset;font-size:var(--f2);line-height:var(--lh2);font-weight:var(--w-medium)}
.tile-due > .ic{flex:none;width:var(--ic-sm);height:var(--ic-sm)}
.tile-due > span{flex:1 0 auto;white-space:nowrap}
.tile-due > .pill-act{margin:var(--s2) 0 var(--s2) auto}

/* copy pill on art: 32 visible, 48 hit */
.pill-copy,.pill-act{position:relative;flex:none;min-height:var(--ctl);padding:var(--s1) var(--s3) var(--s1) var(--s2);border-radius:var(--r-full);display:inline-flex;align-items:center;gap:var(--s1);
  font-size:var(--f2);font-weight:var(--w-medium);color:#fff;background:rgba(255,255,255,.14);box-shadow:0 0 0 1px rgba(255,255,255,.26) inset;
  transition:background var(--dur-state),color var(--dur-state)}
.pill-copy::before,.pill-act::before{content:"";position:absolute;left:calc(-1 * var(--s1));right:calc(-1 * var(--s1));top:50%;height:var(--hit);transform:translateY(-50%)}
.pill-copy{min-width:calc(var(--s16) + var(--s6));justify-content:center}
.pill-copy .ic{width:var(--ic-sm);height:var(--ic-sm)}
.pill-copy.is-disabled{pointer-events:none;color:rgba(255,255,255,.5);background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset}
.pill-act{padding:var(--s1) var(--s3);font-weight:var(--w-semibold)}
.pill-copy:active,.pill-act:active{background:rgba(255,255,255,.24)}
.pill-copy .when-copied,.is-copied > .pill-copy .when-idle,.pill-copy.is-copied .when-idle{display:none}
.is-copied > .pill-copy .when-copied,.pill-copy.is-copied .when-copied{display:inline-flex}
.pill-copy.is-copied,.is-copied > .pill-copy{background:#fff;color:var(--c2);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pill-copy span{display:inline-flex;align-items:center;gap:var(--s1)}

/* hero card (Card details, Add/Edit preview): ISO ID-1 ratio */
.hero{min-height:var(--hero-h);padding:var(--s4);display:flex;flex-direction:column;justify-content:space-between}
.hero .tile-num{font-size:var(--f5);line-height:var(--lh5);letter-spacing:.06em}
.hero .tile-num .dots{margin-right:var(--s3)}
.hero-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--s2);font-size:var(--f2)}
.hero .net{margin:calc(-1 * var(--s1)) calc(-1 * var(--s1)) 0 0}
/* AUDIT6 P2-1: the details pass shares the tile's header grid (bank | mark, type | status chip) and its expired treatment (graphite, Expired chip, date tone) */
.hero.is-expired-tile .hero-foot .num{color:var(--on-art-danger)}
.emv{width:var(--s10);height:var(--s8);border-radius:var(--r-xs);background:linear-gradient(135deg,#F3DFA6,#C9A24E 55%,#E8CF8A);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 1px 2px rgba(0,0,0,.25)}
.emv svg{display:block;width:100%;height:100%}

/* =====================================================================
   NETWORK MARKS. <span class="net" data-net="visa"></span>
   Tone rule (token "mark tone"): WHITE on card art and, for wordmarks, on dark
   theme surfaces; COLOUR on light grounds. Box marks (Amex, JCB, UnionPay) stay
   COLOUR on every surface. Mastercard and Maestro are always COLOUR.
   Force with data-tone="colour|white".
   ===================================================================== */
.net{position:relative;flex:none;display:inline-block;width:var(--mark-w);height:var(--mark-h)}
.net svg{position:absolute;inset:0;width:100%;height:100%}
.net.sm{width:40px;height:20px}
/* P2-2 list / field / autofill slot: fixed 40x24, the logo's own bounds fitted (24 tall; wide marks fill the 40 width) */
.net.slot{width:40px;height:24px}
.mini .net.slot{width:20px;height:12px;bottom:var(--s1)}
/* square marks (Amex, JCB, UnionPay) are drawn 1.14x in the same 40 column so they stay legible at small size */
.net.sm:is([data-net="amex"],[data-net="jcb"],[data-net="unionpay"]){height:var(--mark-h)}
.net.sm:is([data-net="amex"],[data-net="jcb"],[data-net="unionpay"]) svg{inset:calc(-1 * var(--s1)) calc(-1 * var(--s3))}
.net .tw{display:none}
.art .net .tc,[data-theme="dark"] .net .tc{display:none}
.art .net .tw,[data-theme="dark"] .net .tw{display:block}
/* box marks carry their own ground: full colour on dark-theme surfaces (white only on card art) */
[data-theme="dark"] .net:is([data-net="amex"],[data-net="jcb"],[data-net="unionpay"]) .tc{display:block}
[data-theme="dark"] .net:is([data-net="amex"],[data-net="jcb"],[data-net="unionpay"]) .tw{display:none}
.art .net:is([data-net="amex"],[data-net="jcb"],[data-net="unionpay"]) .tc{display:none}
.art .net:is([data-net="amex"],[data-net="jcb"],[data-net="unionpay"]) .tw{display:block}
.net[data-tone="colour"] .tc,.net[data-net="mc"] .tc,.net[data-net="maestro"] .tc{display:block!important}
.net[data-tone="colour"] .tw,.net[data-net="mc"] .tw,.net[data-net="maestro"] .tw{display:none!important}
.net[data-tone="white"] .tw{display:block!important}
.net[data-tone="white"] .tc{display:none!important}
.net-text{display:inline-grid;place-items:center;height:var(--ctl-sm);padding:0 var(--s2);border-radius:var(--r-xs);box-shadow:0 0 0 1px currentColor inset;font-size:var(--f1);font-weight:var(--w-semibold)}

/* =====================================================================
   LIST ROWS + GROUPS. .group > .row ; .row.two for title+supporting
   ===================================================================== */
.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
/* Round 8 (owner 8): a group label's left edge = the card container's left edge (the rounded group's outer edge), never the icon column */
.group-label{font-size:var(--f2);line-height:var(--lh2);font-weight:var(--w-semibold);color:var(--ink-2);padding:var(--s4) 0 var(--s2)}
.row{position:relative;display:flex;align-items:center;gap:var(--s4);min-height:var(--row);padding:var(--s2) var(--s4);width:100%;text-align:left}
.row.two{min-height:var(--row-2)}
.row + .row{box-shadow:0 -1px 0 var(--line)}
button.row:active,.row.is-pressed{background:var(--state)}
.row-lead{flex:none;display:grid;place-items:center;color:var(--ink-2);min-width:var(--ic-lg)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-title{font-size:var(--f3);line-height:var(--lh3);color:var(--ink);overflow-wrap:anywhere}
.row-sub{font-size:var(--f2);line-height:var(--lh2);color:var(--ink-2);overflow-wrap:anywhere}
.row-trail{flex:none;display:flex;align-items:center;gap:var(--s2);color:var(--ink-2);font-size:var(--f2);max-width:50%}
/* inline action in a row subtitle (e.g. "Finish in Android settings"): 48 hit */
.row-link{position:relative;align-self:flex-start;font-size:var(--f2);line-height:var(--lh2);color:var(--accent);text-align:left}
.row-link::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--hit);transform:translateY(-50%)}
/* a row whose trailing control is its own button (row body is not the toggle) */
.row .sw-btn{position:relative;flex:none;display:grid;place-items:center;height:var(--hit);min-width:var(--hit)}   /* the .sw inside carries the 48 hit */
/* L: a leading checkbox/radio sits 12 from its label (box 20, hit 48 unchanged) */
.row.is-check{gap:var(--s3)}
.row.is-check > .row-lead{min-width:0}
/* Round 8 (owner 10): in an editor a checkbox group is a plain list of checkbox rows (no rounded container, no hairlines): the box sits on the
   field edge (the same x as every field box and label), 48 rows, and the list is one form block in the editor's one rhythm (.stack gap s3) */
.cb-list{display:flex;flex-direction:column}
.cb-list > .row{min-height:var(--hit);padding:0}
.cb-list > .row + .row{box-shadow:none}
.row.danger,.row.danger .row-lead,.row.danger .row-title{color:var(--danger)}
.row.is-disabled{pointer-events:none}
.row.is-disabled .row-title,.row.is-disabled .row-lead{color:var(--ink-3)}
.avatar{width:var(--s10);height:var(--s10);border-radius:var(--r-full);display:grid;place-items:center;background:var(--tonal);color:var(--ink);font-size:var(--f2);font-weight:var(--w-semibold)}

/* =====================================================================
   DETAILS ROWS (Card details). .drow ; copy button .cbtn ; states
   .is-copied (value tinted card hue + "Copied" + filled check) and
   .is-revealed (drain line under the row)
   ===================================================================== */
.drow{position:relative;display:flex;flex-wrap:wrap;align-items:center;min-height:var(--row-2);padding:var(--s1) var(--s2) var(--s1) var(--s4);column-gap:var(--s3)}
.drow + .drow{box-shadow:0 -1px 0 var(--line)}
.drow-act{margin-left:auto;display:flex;align-items:center}
.drow-act .copied-word{margin-left:0}
.drow-k{flex:none;min-width:72px;font-size:var(--f2);line-height:var(--lh2);color:var(--ink-2)}
/* value never ellipsizes: it keeps its min-content width and wraps under the key when the row is too narrow */
.drow-v{flex:1 1 0;font-size:var(--f3);line-height:var(--lh3);font-weight:var(--w-medium);transition:color var(--dur-state)}
.drow-v.num{font-weight:var(--w-medium)}
.drow-v .dots{color:var(--ink-2);margin-right:var(--s2)}
.drow-v .dots.solo{margin-right:0}
.drow-v.is-none{color:var(--ink-2);font-weight:var(--w-regular)}
.copied-word{margin-left:auto;font-size:var(--f1);font-weight:var(--w-medium);color:var(--hue-ink);opacity:0;transition:opacity var(--dur-state);margin-right:var(--s1)}
.cbtn{position:relative;flex:none;width:var(--hit);height:var(--hit);display:grid;place-items:center}
.cbtn > span{width:var(--ctl-md);height:var(--ctl-md);border-radius:var(--r-full);display:grid;place-items:center;background:var(--tonal);color:var(--ink);transition:background var(--dur-state),color var(--dur-state)}
.cbtn .ic{width:var(--ic-sm);height:var(--ic-sm)}
.cbtn:active > span{background:var(--tonal-2)}
.cbtn .when-copied{display:none}
.drow.is-copied .drow-v{color:var(--hue-ink)}
.drow.is-copied .drow-v .dots{color:inherit;opacity:.72}
.drow.is-copied .copied-word{opacity:1}
.drow.is-copied .cbtn > span{background:var(--c2);color:#fff}
.drow.is-copied .cbtn .when-idle{display:none}
.drow.is-copied .cbtn .when-copied{display:block}
.drow.is-revealed::after{content:"";position:absolute;left:var(--s4);bottom:0;height:2px;width:calc((100% - var(--s8)) * var(--drain,.6));background:var(--ink);border-radius:var(--r-full)}
/* card hue ink: c2 on light surfaces, lightened in dark */
[data-hue],[data-card]{--hue-ink:var(--c2)}
[data-theme="dark"] [data-hue],[data-theme="dark"] [data-card]{--hue-ink:color-mix(in oklab,var(--c2) 40%,#fff)}

/* =====================================================================
   BUTTONS. .btn + .btn-filled | .btn-tonal | .btn-outline | .btn-text | .btn-danger
   36 visible (.lg = 44), 48 hit. States: :active/.is-pressed, :focus-visible/.is-focused,
   [disabled]/.is-disabled, .is-loading
   ===================================================================== */
.btn{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--ctl-md);padding:var(--s1) var(--s4);border-radius:var(--r-full);
  font-size:var(--f2);line-height:var(--lh2);font-weight:var(--w-semibold);white-space:nowrap;isolation:isolate}
.btn::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--hit);transform:translateY(-50%)}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;z-index:-1;transition:opacity var(--dur-state)}
.btn:active::after,.btn.is-pressed::after{opacity:.12}
.btn .ic{width:var(--ic-sm);height:var(--ic-sm)}
.btn.lg{min-height:var(--ctl-lg);padding:var(--s2) var(--s6);font-size:var(--f3);line-height:var(--lh3)}
/* full-width buttons may wrap their label at large text instead of clipping it */
.btn.block,.sheet-actions.full > .btn,.first-actions .btn{white-space:normal;text-align:center}
.btn.lg .ic{width:var(--ic);height:var(--ic)}
.btn.block{width:100%}
.btn-filled{background:var(--brand);color:var(--on-brand)}   /* M3 filled button: elevation level 0, no tinted shadow */
.btn-tonal{background:var(--tonal);color:var(--ink)}
.app .btn-tonal{background:var(--tonal-2)}   /* on the app background the tonal fill steps up one level so it reads as a button */
.btn-outline{color:var(--ink);box-shadow:0 0 0 1px var(--outline) inset}
.btn-text{color:var(--accent);padding:0 var(--s3);min-width:var(--hit)}
.btn-text.neutral{color:var(--ink-2)}
.btn-text.danger{color:var(--danger)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn.is-focused{outline:2px solid var(--accent);outline-offset:2px}
/* Round 8 (owner 7): three looks. Primary = filled brand. Secondary (Cancel / secondary in sheet footers) = outlined: 1dp --outline (>= 3:1 on
   every surface: 3.53-4.12), ink text, transparent fill, never the grey tonal that reads as disabled. Disabled (any variant) = M3: content ink 38%,
   container ink 12% (outline ink 12%), no shadow, no state layer, cursor not-allowed, disabled + aria-disabled. Compose: ButtonDefaults disabled* colours */
.btn:disabled,.btn.is-disabled{box-shadow:none;cursor:not-allowed}
.btn.is-disabled:not(:disabled){pointer-events:none}
.btn:disabled::after,.btn.is-disabled::after{opacity:0}
.btn-filled:disabled,.btn-filled.is-disabled,.btn-tonal:disabled,.btn-tonal.is-disabled,.btn-danger:disabled,.btn-danger.is-disabled{background:color-mix(in srgb,var(--ink) 12%,transparent);color:color-mix(in srgb,var(--ink) 38%,transparent)}
.btn-text:disabled,.btn-text.is-disabled{color:color-mix(in srgb,var(--ink) 38%,transparent)}
.btn-outline:disabled,.btn-outline.is-disabled{color:color-mix(in srgb,var(--ink) 38%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent) inset}
.btn.is-loading{pointer-events:none}
.btn.is-loading .ic{display:none}
.actions{display:flex;justify-content:flex-end;gap:var(--s2);flex-wrap:wrap}
.spin{width:var(--ic-sm);height:var(--ic-sm);border-radius:var(--r-full);border:2px solid currentColor;border-right-color:transparent;animation:qc-spin 800ms linear infinite;flex:none}
@keyframes qc-spin{to{transform:rotate(1turn)}}

/* =====================================================================
   TEXT FIELD. .tf > .tf-label + .tf-box(.tf-input, .tf-trail) + .tf-help
   States: .is-focused .is-error .is-disabled. Help line only when there is help (QC.tf).
   ===================================================================== */
.tf{display:flex;flex-direction:column;gap:var(--s1)}
.tf-label{font-size:var(--f2);line-height:var(--lh2);font-weight:var(--w-medium);color:var(--ink-2)}
.tf-box{display:flex;align-items:center;gap:var(--s2);min-height:var(--field);padding:0 var(--s1) 0 var(--s3);border-radius:var(--r-md);background:var(--surface);box-shadow:0 0 0 1px var(--outline) inset}
.tf-input{flex:1;font-size:var(--f3);line-height:var(--lh3);color:var(--ink)}
.tf-input.num{letter-spacing:var(--track-num)}
.tf-trail{display:flex;align-items:center;color:var(--ink-2)}
.tf-trail .net{margin-right:var(--s1)}
.tf-help{font-size:var(--f1);line-height:var(--lh1);color:var(--ink-2)}
.tf.is-focused .tf-box,.tf-box:focus-within{box-shadow:0 0 0 2px var(--accent) inset}
.tf.is-focused .tf-label{color:var(--accent)}
.tf.is-error .tf-box{box-shadow:0 0 0 2px var(--danger) inset}
.tf.is-error .tf-label,.tf.is-error .tf-help{color:var(--danger)}
.tf.is-warn .tf-help{color:var(--warn)}   /* a warning never blocks Save (Expired) */
.tf-help.has-act{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.tf-help.has-act > .btn{flex:none;margin:calc(-1 * var(--s2)) calc(-1 * var(--s3)) calc(-1 * var(--s2)) 0}
.tf.is-disabled{pointer-events:none}
.tf.is-disabled .tf-box{background:var(--tonal);box-shadow:none}
.tf.is-disabled .tf-input,.tf.is-disabled .tf-label{color:var(--ink-3)}
.tf-label.has-act{display:flex;align-items:center;justify-content:space-between}
.tf-label.has-act .btn{margin:calc(-1 * var(--s2)) calc(-1 * var(--s3)) calc(-1 * var(--s2)) 0}
.tf-trail.caret{margin-right:var(--s2)}
/* P2-4: a picker field is a button (Role.DropdownList) that opens the Qc picker sheet; value or placeholder inside, caret trailing */
.tf-pick{display:flex;align-items:center;align-self:stretch;min-width:0;text-align:left;cursor:pointer}
.tf-pick > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf-pick > .tf-ph{color:var(--ink-ph)}
.tf-pick:focus-visible{outline:0}
.tf.is-disabled .tf-pick{color:var(--ink-3)}
/* F: an inline action lives inside the field as its trailing element (text button, 48 hit, text ends 16 from the box edge) */
.tf-act{margin-left:auto}
.tf-box:has(.tf-act){padding-right:var(--s1)}
.tf-row{display:flex;gap:var(--s3)}
.tf-row > .tf{flex:1;min-width:0}
/* value row (picker launcher): looks like a row inside a group */
.vrow-value{color:var(--ink-2);font-size:var(--f2)}

/* =====================================================================
   SELECTION CONTROLS (neutral). .cb checkbox 20 | .rd radio 20 | .sw switch 44x24
   Add .is-on ; .is-disabled. All sit inside a 48 hit (row or ::before).
   ===================================================================== */
.cb,.rd,.sw{position:relative;flex:none;display:inline-grid;place-items:center}
.cb::before,.rd::before,.sw::before{content:"";position:absolute;left:50%;top:50%;width:var(--hit);height:var(--hit);transform:translate(-50%,-50%)}
.cb{width:var(--ic);height:var(--ic);border-radius:var(--r-xs);box-shadow:0 0 0 2px var(--ink-2) inset;color:var(--on-select)}
.cb .ic{width:var(--ic-xs);height:var(--ic-xs);display:none}
.cb.is-on{background:var(--select);box-shadow:none}
.cb.is-on .ic{display:block}
.rd{width:var(--ic);height:var(--ic);border-radius:var(--r-full);box-shadow:0 0 0 2px var(--ink-2) inset}
.rd.is-on{box-shadow:0 0 0 2px var(--select) inset}
.rd.is-on::after{content:"";width:10px;height:10px;border-radius:var(--r-full);background:var(--select)}
.sw{width:44px;height:var(--ctl-sm);border-radius:var(--r-full);background:var(--tonal-2);box-shadow:0 0 0 1px var(--outline) inset;transition:background var(--dur-state)}
.sw::after{content:"";position:absolute;left:var(--s1);top:var(--s1);width:var(--ic-xs);height:var(--ic-xs);border-radius:var(--r-full);background:var(--ink-2);transition:transform var(--dur-state),background var(--dur-state)}
.sw.is-on{background:var(--select);box-shadow:none}
.sw.is-on::after{background:var(--on-select);transform:translateX(var(--s5))}
.cb.is-disabled,.rd.is-disabled,.sw.is-disabled{opacity:.38;pointer-events:none}

/* CHIPS. .chip (32, filter/holder) .is-on selected ; .chip .x trailing remove ; .tag (24, labels) */
.chips .spacer{flex:1}
.chips{display:flex;align-items:center;gap:var(--s2);min-height:var(--hit);flex:none;padding:0 var(--s1) 0 var(--s4)}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--ctl);padding:var(--s1) var(--s3);border-radius:var(--r-full);
  font-size:var(--f2);font-weight:var(--w-medium);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset;background:var(--surface)}
.chip{min-width:var(--hit);justify-content:center}
.chip::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--hit);transform:translateY(-50%)}
.chip .ic{width:var(--ic-sm);height:var(--ic-sm)}
.chip.is-on{background:var(--select);color:var(--on-select);box-shadow:none}

  never random; see QC.patFor). Graphite also marks expired cards and keeps its own pattern (lines). */
  navy:{c1:"#0B1D57",c2:"#2B4EC2",pat:"rings"},      rust:{c1:"#3A1208",c2:"#983A1C",pat:"lines"},
  forest:{c1:"#04362C",c2:"#0B644D",pat:"lines"},    plum:{c1:"#2A0E3D",c2:"#6E2C9A",pat:"weave"},

  ocean:{c1:"#04283F",c2:"#0F5D8B",pat:"rosette"},   indigo:{c1:"#140F4A",c2:"#4338B8",pat:"contours"},
  violet:{c1:"#1F0D45",c2:"#683AC0",pat:"rosette"},  magenta:{c1:"#3A0A31",c2:"#9B2580",pat:"rings"},
  wine:{c1:"#46081C",c2:"#A81A43",pat:"lines"},      crimson:{c1:"#3E0709",c2:"#A3202A",pat:"weave"},
  burnt_orange:{c1:"#3F1A03",c2:"#8C4409",pat:"rosette"}, olive:{c1:"#22240A",c2:"#565C1D",pat:"contours"},
  moss:{c1:"#172509",c2:"#43611F",pat:"weave"},      slate:{c1:"#141B26",c2:"#3E4C61",pat:"rings"}
};
/* Round 8 (owner 2): PATTERN FOLLOWS COLOUR. Deterministic, never random. Each of the 16 bands has one fixed pattern, assigned along the palette
   order (navy → ocean → … → slate, then graphite) so neighbouring hues always differ; graphite (and so every expired card) keeps lines.
   A custom colour hashes its hex (the light stop c2, FNV-1a 32-bit) to a stable index in QC.PATS. Same colour = same pattern, so cards of one
   colour read as a family; changing a card's colour changes its pattern. Compose: QcCardArt.patternFor(band) / patternFor(hex) */
QC.PATS = ["rings","lines","contours","rosette","weave"];
QC.hashHex = hex => { let h = 0x811c9dc5; for (const ch of String(hex).replace("#","").toUpperCase()) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h; };

  hdfc:{id:"hdfc",bank:"HDFC Bank",type:"Credit",net:"visa",last:"0366",groups:["4532","7180","2299","0366"],holder:"Aarav Mehta",exp:"12/29",cvv:"482",note:"Use for fuel",hue:"navy",pinned:true,tags:["Fuel"],dueDay:22},

  axis:{id:"axis",bank:"Axis Bank",type:"Credit",net:"rupay",last:"9021",groups:["6521","4408","3312","9021"],holder:"Diya Mehta",exp:"03/28",cvv:"307",note:"Travel card. 2 free lounge visits a quarter, 1% forex markup. Call the bank before a trip abroad.",hue:"wine",tags:["Travel"]},
  sbi:{id:"sbi",bank:"SBI",type:"Debit",net:"visa",last:"5530",groups:["4716","2205","8148","5530"],holder:"Aarav Mehta",exp:"11/26",cvv:"664",note:"",hue:"ocean"},
  /* an older SBI card, expired and archived (not in QC.ORDER) */

  /* P2-1: a second archived card (closed, not expired). Archived cards never show "Last used" and are not in QC.ORDER */
  axisOld:{id:"axisOld",bank:"Axis Bank",type:"Debit",net:"mc",last:"6604",groups:["5241","9907","3318","6604"],holder:"Diya Mehta",exp:"04/29",cvv:"551",note:"",hue:"slate",archived:true,reason:"Card closed"}
};
/* Round 6: ONE canonical dataset (above) + a fixed "today". Every status, order and count is DERIVED here; no frame passes a status.

QC.TODAY = {y:2026, m:11, d:20};   /* Fri 20 Nov 2026 */
QC.PREFS = {soonMonths:1, expired:"end", pinLimit:10, dueWindow:3, expiryRemind:30};   /* Settings defaults shown in the frames */
QC.MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
QC.dayN = (y, m, d) => Date.UTC(y, m - 1, d) / 864e5;   /* day number; m is 1-based; d = 0 -> last day of the month before */

QC.isExpired = c => QC.daysToExpiry(c) < 0;

QC.count = (pred = () => true, o = {}) => (o.archived ? QC.STORED : QC.ACTIVE).filter(id => pred(QC.CARDS[id])).length;

QC.REPAIR = {fixed:["icici","axis","sbi"], check:["sbi"]};
/* "Changed from …" only for a real value change: a separator-only edit ("4716-2205-…" -> "4716 2205 …") shows nothing */
QC.changedFrom = (before, after) => before.replace(/\D/g, "") === after.replace(/\D/g, "") ? "" : `Changed from <span class="num">${QC.esc(before)}</span>`;
/* Round 3 (a): the last 3 copied cards, most recent first. Search opens with them as "Recent"; RECENT[0] shows "Last used" on Home

/* network mark span; hydrated with colour + white versions; CSS picks the tone */

QC.NETBOX = {visa:"4 6.2 48 15.6", mc:"15.1 4 25.8 16", rupay:"4 7.7 48 12.6", amex:"18 4 20 20", diners:"4 7.8 48 12.5", discover:"4 9.4 50 8.3", jcb:"15.1 4.1 25.8 19.8", maestro:"15.1 4 25.8 15.9", mir:"4 7.2 48 13.6", unionpay:"12 4 32 20"};

QC.NETNAME = {visa:"Visa",mc:"Mastercard",rupay:"RuPay",amex:"American Express",diners:"Diners Club",discover:"Discover",jcb:"JCB",maestro:"Maestro",mir:"Mir",unionpay:"UnionPay"};
QC.hueOf = c => QC.HUES[(typeof c==="string" ? (QC.CARDS[c]?QC.CARDS[c].hue:c) : c.hue)] || QC.HUES.navy;
QC.card = c => typeof c==="string" ? QC.CARDS[c] : c;
/* the one masked-number format: n bullets (U+2022) + last 4, mono digits. Tile/sheet/dialog/notification/autofill use n=2; hero and details n=4.
   Never put a "·" separator straight before it: "HDFC Bank ••0366", holder on its own line. */
QC.dots = (n=2) => `<span class="dots">${"•".repeat(n)}</span>`;
QC.masked = (last, n=2, cls="") => `<span class="num${cls?" "+cls:""}">${QC.dots(n)}${last}</span>`;

/* Home tile. Round 6: status, due strip and "Last used" are DERIVED from the card + QC.TODAY + QC.PREFS (no status option exists).
   opts (frame events and display only): {copied, lastId (the card copied last in this frame; null = none), paid (bill marked paid in this frame),
   check (repair flag), inArchive (the Archived list: reason in the status chip), copyDisabled, holder:false, note:false}

/* AUDIT6 P2-1 + Round 8 (owner 5): ONE status slot and ONE chip for every pass (tile, details hero, Archived, adaptive, gallery). Derived from the
   card + QC.TODAY + QC.PREFS; returns {flag (chip HTML), said (TalkBack suffix)}. One chip, by priority Archived > Expired > Check > Expires soon > Last used.
   Archived outside the Archived list = "Archived · reason"; inside it (o.inArchive) the chip is the reason alone. o.check: legacy repair flag ("Check",
   read as "Check details"; no icon). o.last: "Last used". o.srCheck: the chip itself carries "Check details" (hero: no button label) */
QC.flag = (c, o={}) => { const status = QC.status(c);
  const arch = !c.archived ? "" : o.inArchive ? (c.reason || "") : (c.reason ? `Archived · ${c.reason}` : "Archived");
  const kind = arch ? (o.inArchive ? "reason" : "arch") : status === "Expired" ? "expired" : o.check ? "check" : status ? "soon" : o.last ? "last" : "";
  const text = {arch, reason:arch, expired:status, check:"Check", soon:status, last:"Last used"}[kind] || "";

QC.tile = (c, o={}) => { c=QC.card(c); const expired=QC.isExpired(c); const hue=expired?"graphite":c.hue; const pin=c.pinned&&!c.archived;

/* app bars */

/* ---------- shared form + overlay builders (parts must use these, never local copies) ---------- */
/* text field. o = {warn (help line in warn tone, never blocks), helpAct (button html at the end of the help line, e.g. Open), multi (wraps to a 2nd line at large text; Compose maxLines = 2), lead (html before the input), ph, num, pw, help, err, focus, disabled, trail (html), net (key or "" = empty slot), pick, act (label-row button html), data (input attrs), cls}

   o.action = "Add": inline action INSIDE the field as its trailing text button (F); o.actionAttrs for its attributes */
QC.tf = (label, val="", o={}) => {
  const trail = o.action ? `<button class="btn btn-text tf-act${o.actionOff?" is-disabled":""}"${o.actionOff?' disabled aria-disabled="true"':""}${o.actionAttrs?" "+o.actionAttrs:""}>${o.action}</button>`

    : o.net!==undefined ? `<span class="tf-trail" data-tf-net>${o.net?QC.net(o.net,"slot"):""}</span>`

/* sheet / screen footer.

     -> full-width buttons on the content edges (sheet 24, screen 16), 16 above the gesture area. Round 8: secondary (Cancel) is OUTLINED, left of

  if (typeof b === "string") return `<div class="sheet-actions">${b}</div>`;
  const tone = (b.tone || (b.secondary ? "filled" : "tonal")) === "filled" ? "btn-filled" : "btn-tonal";
  /* b.note: one line above a disabled primary saying what is missing ("Add the expiry"); the button is described by it */
  const nid = b.note ? "san-" + (QC._san = (QC._san || 0) + 1) : "";
  const p = b.primary ? `<button class="btn lg ${tone}${b.disabled?" is-disabled":""}"${b.disabled?' disabled aria-disabled="true"':""}${nid?` aria-describedby="${nid}"`:""}${b.attrs?" "+b.attrs:""}>${b.primary}</button>` : "";

QC.dialog = (o) => { const id = o.id || "dlg-" + (QC._dlg = (QC._dlg || 0) + 1);
  return `${o.scrim===false?"":`<div class="scrim" data-act="close-overlay"></div>`}<div class="dialog${o.cls?" "+o.cls:""}" role="${o.alert?"alertdialog":"dialog"}" aria-labelledby="${id}">${o.icon?`<div class="dialog-icon">${QC.ic(o.icon)}</div>`:""}<div class="dialog-title" id="${id}" role="heading" aria-level="2">${o.title}</div>${o.body||o.content?`<div class="dialog-scroll">${o.body?`<div class="dialog-body">${o.body}</div>`:""}${o.content||""}</div>`:""}<div class="actions">${o.actions||""}</div></div>`; };
/* toggle row: the whole row is the switch/checkbox (Compose: Modifier.toggleable(role), control onCheckedChange = null).

QC.toggleRow = (title, on, o={}) => { const k=o.kind||"switch";
  const ctl = k==="switch" ? `<span class="sw${on?" is-on":""}" aria-hidden="true"></span>` : `<span class="cb${on?" is-on":""}" aria-hidden="true">${QC.ic("check")}</span>`;

<!-- 10-home: Lock, first-run tips, Home (list, copied, search + Recent, last 4, no matches, first run, long-press), Card details, actions, delete -> Undo -->
<style id="p10-css">
/* part 10 only. Tokens only. */
/* Recent (search, empty query): open = full-bleed sibling button, copy disc above it (never nested) */
.p10-recent{padding-bottom:var(--s3)}
.p10-rc{gap:var(--s3);padding-right:var(--s2)}
.p10-rc > .row-lead{min-width:var(--mini-w)}
.p10-rc-open{position:absolute;inset:0;z-index:1}
.p10-rc-open:active,.p10-rc.is-pressed > .p10-rc-open{background:var(--state)}
.p10-rc > .copied-word,.p10-rc > .cbtn{position:relative;z-index:2}
.p10-rc > .copied-word{display:none;margin-right:0}
.p10-rc.is-copied > .copied-word{display:block;opacity:1}
.p10-rc.is-copied .cbtn > span{background:var(--c2);color:#fff}
.p10-rc.is-copied .cbtn .when-idle{display:none}
.p10-rc.is-copied .cbtn .when-copied{display:block}
/* live Home: Recent shows only while search is open and the query is empty */
.view .p10-recent{display:none}
.view.is-searching .p10-recent:not([hidden]){display:block}
/* first-run tips: one line + a visual made of the real card art; 3 pages, shown once */
.p10-tip{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:var(--s8)}
.p10-vis{position:relative;width:100%;text-align:left}
.p10-vis > .art{width:100%}
.p10-line{margin-top:var(--s12);font-size:var(--f4);line-height:var(--lh4);font-weight:var(--w-semibold);letter-spacing:var(--track-title)}
.p10-dots{display:flex;justify-content:center;gap:var(--s2);padding-top:var(--s4)}
.p10-dots > i{width:var(--s2);height:var(--s2);border-radius:var(--r-full);background:var(--tonal-2)}
.p10-dots > i.is-on{width:var(--s6);background:var(--ink)}
/* tip 2: a lock seal sits on the card's lower edge */
.p10-seal{position:absolute;left:50%;bottom:calc(-1 * var(--s6));transform:translateX(-50%);z-index:3;width:var(--s12);height:var(--s12);border-radius:var(--r-full);display:grid;place-items:center;background:var(--surface-hi);color:var(--ink);box-shadow:var(--e2)}
.p10-seal .ic{width:var(--ic-lg);height:var(--ic-lg)}
/* tip 3: a wallet of three cards; the back two show only their top edge */
.p10-wallet{height:calc(var(--hero-h) + var(--s10) * 2)}
.p10-wallet > .art{position:absolute;left:0;right:0;margin:0 auto}
.p10-wallet > .art:nth-child(1){top:0;width:84%}
.p10-wallet > .art:nth-child(2){top:var(--s10);width:92%}
.p10-wallet > .art:nth-child(3){top:calc(var(--s10) * 2);width:100%}
/* Round 5: dialog fields (archive reason), the system share sheet (drawn for context), the active filter chip row */
.dialog .p10-fields{margin-top:var(--s4)}
.p10-count{display:block;text-align:right;font-variant-numeric:tabular-nums}
.p10-share{padding-bottom:var(--s8)}
.p10-sh-prev{margin:var(--s2) var(--s6) 0;padding:var(--s4);border-radius:var(--r-lg);background:var(--tonal);font-size:var(--f2);line-height:var(--lh2);color:var(--ink)}
.p10-sh-prev b{display:block;font-size:var(--f1);line-height:var(--lh1);font-weight:var(--w-medium);color:var(--ink-2);margin-bottom:var(--s1)}
.p10-sh-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);padding:var(--s6) var(--s4) 0}
.p10-app{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--s2);min-height:var(--hit);font-size:var(--f1);line-height:var(--lh1);color:var(--ink);text-align:center}
.p10-app > span{width:var(--s12);height:var(--s12);border-radius:var(--r-full);display:grid;place-items:center;background:var(--tonal);color:var(--ink)}
.p10-banner{margin-bottom:var(--s3)}

<section class="sec" id="sec-cards" data-nav="Cards">
  <h2 class="sec-h">Cards</h2>
  <div class="shots" id="shots-cards"></div>
</section>
<script>
document.head.appendChild(document.getElementById("p10-css")); /* survive ?shot= mode */
(function(){
const ic = QC.ic;
/* the most recently copied card shows "Last used" (QC.tile default); a copy in this screen makes that card the last used */
const list = (ids, o={}) => `<div class="list">${ids.map(id => QC.tile(id, o.copied ? {copied:o.copied===id, lastId:o.copied} : {})).join("")}</div>`;
/* Round 6: search results are derived from the dataset (main search also finds archived cards, labelled by QC.tile) */
const find = q => { const d = q.replace(/\s+/g, ""); return [...QC.ORDER, ...QC.ARCHIVED].filter(id => { const c = QC.CARDS[id];
  return [c.bank, c.holder, ...(c.tags||[]), QC.NETNAME[c.net], c.type, c.note||"", c.reason||""].join(" ").toLowerCase().includes(q.toLowerCase()) || (/^\d+$/.test(d) && c.groups.join("").includes(d)); }); };
const homeView = (o={}) => QC.homeBar(o) + (o.search?"":QC.holderChips()) + `<div class="content">${o.body||list(QC.ORDER,o)}</div>` + (o.search?"":QC.navbar("cards"));
const noMatch = `<div class="empty compact" data-noresult><div class="empty-ic">${ic("search")}</div><div class="empty-title">No matches</div><div class="empty-body">Try a bank, holder, tag or digits</div><div class="actions"><button class="btn btn-text" data-act="search-clear">Clear search</button></div></div>`;

/* (a) Recent: the last 3 copied cards. Row opens the card; the disc copies the number in place (no snackbar) */
const rc = (id, copied) => { const c = QC.CARDS[id];
  return `<div class="row two p10-rc${copied?" is-copied":""}" data-card="${id}" style="${QC.vars(c)}"><button class="p10-rc-open" data-open="${id}" aria-label="${c.bank}, ending ${c.last}"></button>
    <span class="row-lead">${QC.mini(id)}</span><span class="row-main"><span class="row-title">${c.bank} ${QC.masked(c.last)}</span><span class="row-sub">${c.type} · ${c.holder}</span></span>
    <span class="copied-word">Copied</span><button class="cbtn" data-p10-copy="Card number copied" aria-label="${copied?`${c.bank} card number copied`:`Copy ${c.bank} card number ending ${c.last}`}"><span>${ic("content_copy","when-idle")}${ic("check","when-copied")}</span></button></div>`; };
const recent = (ids=QC.RECENT, o={}) => `<div class="p10-recent" data-recent role="group" aria-label="Recent"><div class="group-label">Recent</div><div class="group">${ids.map(id => rc(id, o.copied===id)).join("")}</div></div>`;
QC.p10 = {recent, rc};

const lock = QC.lockScreen();
/* system biometric prompt (drawn for context). sub = the deck's verb + object ("Share card"); the system adds the rest */
const sysPrompt = (sub="") => `<div class="scrim"></div><div class="sheet sys-prompt" role="dialog" aria-label="Unlock QuickCards"><div class="sheet-handle"></div>
  <div class="empty" style="padding-top:var(--s4)"><div class="sheet-title">Unlock QuickCards</div>${sub?`<div class="empty-body">${sub}</div>`:""}<div class="empty-ic" style="margin-top:var(--s6)">${ic("fingerprint")}</div></div>
  <div class="actions" style="justify-content:flex-start;padding:var(--s6) var(--s4) 0"><button class="btn btn-text">Use PIN</button></div></div>`;
const prompt = sysPrompt();
QC.sysPrompt = sysPrompt;

/* (c) first-run tips: at most 3, shown once before the empty vault. One line each + a visual of the real card art.
   Skip on every page (to the empty vault); Back goes to the previous page; the last page's Add card opens the form. */
const dots = n => `<div class="p10-dots" role="img" aria-label="Tip ${n} of 3">${[1,2,3].map(i=>`<i${i===n?' class="is-on"':""}></i>`).join("")}</div>`;
const tipBar = `<div class="appbar"><span class="spacer"></span><button class="btn btn-text neutral">Skip</button></div>`;
const tip = (n, vis, line) => tipBar + `<div class="content p10-tip"><div class="p10-vis" inert aria-hidden="true">${vis}</div><div class="p10-line">${line}</div></div>` + dots(n) +
  QC.sheetActions(n<3 ? {primary:"Next", screen:1} : {primary:`${ic("add")}Add card`, tone:"filled", screen:1});
const t1 = QC.tile("icici", {copied:true, lastId:null});   /* first run: an illustration, nothing has been used yet */
const t2 = QC.hero("hdfc") + `<span class="p10-seal">${ic("lock")}</span>`;
const t3 = `<div class="p10-wallet">${["icici","axis","hdfc"].map(id => QC.hero(id)).join("")}</div>`;

/* first run (B): a faded jewel sample card, title + one line, one filled Add card at the bottom, two equal tonal options.
   Top bar: same as Home; search hides (nothing to search), + stays where it always is. "Tap a card" shows on NFC phones only. */
const sample = QC.art("navy", "hero sample", `<div class="tile-row tile-top"><div class="tile-bank">Your bank</div></div>
  <div class="emv"><svg viewBox="0 0 40 32" fill="none" stroke="rgba(90,62,10,.45)" stroke-width="1"><path d="M0 11h13v10H0M40 11H27v10h13M13 0v32M27 0v32M13 16h14"/></svg></div><div><div class="num tile-num">${QC.dots(2)}0000</div><div class="hero-foot"><span></span><span class="num">MM/YY</span></div></div>`, 'aria-hidden="true"');
const first = `<div class="first">${sample}<div class="first-title">Add your first card</div><div class="first-body">Encrypted. Stays on this phone.</div>
  <div class="first-actions"><button class="btn btn-filled lg block">${ic("add")}Add card</button>
  <div class="row-actions"><button class="btn btn-tonal lg">${ic("download")}Import</button><button class="btn btn-tonal lg">${ic("contactless")}Tap a card</button></div></div></div>`;
/* interactive Home: two views in one phone; overlays are rebuilt per opened card. Search opens on Recent; typing filters the list */
const live = `<div class="views" style="position:absolute;inset:0">
  <div class="view" data-view="home">${homeView({body: recent() + list(QC.ORDER) + noMatch.replace("data-noresult","data-noresult hidden")})}</div>
  <div class="view is-off" data-view="details" data-details-slot></div></div>`;
const ov = c => `<div data-sheet hidden>${QC.actionsSheet(c)}</div><div data-dialog hidden>${QC.deleteDialog(c)}</div>`;
/* ---------- Round 5 (AUDIT4 P2-2, P2-3): note on the pass, Share, Archive, repair, pin limit, archived in search ---------- */
/* Share: unlock first ("Share card"), then the dialog (Include CVV off by default), then the system share sheet with the text */
const cvvRow = QC.toggleRow("Include CVV", false).replace('role="switch"', 'role="switch" aria-description="Off. Only if the person needs it."');
const shareDlg = QC.dialog({id:"p10-share", title:"Share card", body:"Sends bank, number, expiry and name as text.", content:cvvRow,
  actions:`<button class="btn btn-text neutral" data-act="close-overlay">Cancel</button><button class="btn btn-text">Share</button>`});
const app = (icon, label) => `<button class="p10-app"><span>${ic(icon)}</span>${label}</button>`;
const shareSheet = `<div class="scrim"></div><div class="sheet p10-share" role="dialog" aria-label="Share (Android share sheet)"><div class="sheet-handle"></div>
  <div class="p10-sh-prev"><b>Text</b>HDFC Bank<br><span class="num">4532 7180 2299 0366</span><br>Expiry <span class="num">12/29</span><br>Aarav Mehta</div>
  <div class="p10-sh-apps">${app("sms","Messages")}${app("mail","Email")}${app("notes","Notes")}${app("folder_open","Files")}</div></div>`;
/* Archive: dialog with an optional 40-character reason (placeholder, counter); Archive is not destructive, so it is not red */
const archiveDlg = QC.dialog({id:"p10-arch", title:"Archive card?", body:"Moves to Manage › Archived.",
  content:`<div class="p10-fields">${QC.tf("Reason (optional)", "", {ph:"Card closed", focus:1, help:`<span class="p10-count">0/40</span>`})}</div>`,
  actions:`<button class="btn btn-text neutral" data-act="close-overlay">Cancel</button><button class="btn btn-text">Archive</button>`});
/* legacy repair: one dismissible banner after the first repair; Review turns on the "Needs check (1)" filter. Flagged pass: the "Check" chip.
   Round 8 (owner 4): the one banner component, one line "3 fixed · 1 to check" + Review (text button) + a 48 close icon button "Dismiss" */
const RP = QC.REPAIR, checkOpts = Object.fromEntries(RP.check.map(id => [id, {check:true}]));
const repairBanner = `<div class="banner p10-banner" role="status">${ic("auto_fix_high")}<div class="banner-main"><div class="banner-title">${RP.fixed.length} fixed · ${RP.check.length} to check</div></div><div class="actions"><button class="btn btn-text">Review</button>${QC.ibtn("close","Dismiss")}</div></div>`;
const tiles = (ids, opts={}) => `<div class="list">${ids.map(id => QC.tile(id, opts[id] || {})).join("")}</div>`;
const checkChips = `<div class="chips" role="group" aria-label="Filters"><button class="chip is-on has-x" aria-label="Needs check, ${QC.cards(RP.check.length)}. Remove filter">${ic("check")}Needs check (${RP.check.length})${ic("close","xs")}</button><span class="spacer"></span>${QC.ibtn("tune","Filter","","muted")}</div>`;
const checkView = QC.homeBar() + checkChips + `<div class="content">${tiles(RP.check, checkOpts)}</div>` + QC.navbar("cards");
/* notes (Round 8, owner 1): Axis has a long note, shown as 2 lines + ellipsis (no More/Less); the full note is on Card details; a hold copies it */
const noteView = homeView({body: tiles(QC.ORDER)});

/* (b) long-press a tile: pressed layer while held, then the card actions sheet (same sheet as ⋮) */
const pressed = list(QC.ORDER).replace('class="art tile" data-hue="navy"', 'class="art tile is-pressed" data-hue="navy"');
QC.addScreens("#shots-cards", [
  ["lock", "Lock", lock],
  ["lock-prompt", "Unlock prompt", lock, prompt],
  ["tips-1", "Tip 1 · copy", tip(1, t1, "Tap to copy. Hold for more.")],
  ["tips-2", "Tip 2 · encrypted", tip(2, t2, "Encrypted on this phone")],
  ["tips-3", "Tip 3 · add", tip(3, t3, "Add your first card")],
  ["home", "Home · try it", live, ov("hdfc"), 'data-live'],
  ["home-copied", "Number copied", homeView({copied:"hdfc"})],
  ["home-recent", "Search · Recent", homeView({search:true, body: recent() + list(QC.ORDER)})],
  ["home-search", "Search", homeView({search:true,q:"aarav",body:list(find("aarav"))})],
  /* P1-2: digits match anywhere in the number; the result still shows only the last 4 */
  ["home-search-digits", "Any digits", homeView({search:true,q:"7180",body:list(find("7180"))})],
  ["home-noresult", "No matches", homeView({search:true,q:"Kotak",body:noMatch})],
  ["home-empty", "First run", QC.homeBar({noSearch:true}) + `<div class="content col">${first}</div>` + QC.navbar("cards")],
  ["home-hold", "Long-press a card", homeView({body:pressed})],
  ["home-hold-sheet", "Opens card actions", homeView({body:pressed.replace(" is-pressed","")}), QC.actionsSheet("hdfc")],
  ["card", "Card", QC.detailsScreen("hdfc")],
  ["card-copied", "Value copied", QC.detailsScreen("hdfc",{copied:"number"})],
  ["card-reveal", "CVV held", QC.detailsScreen("hdfc",{revealed:"cvv",drain:.6})],
  ["card-actions", "Card actions", QC.detailsScreen("hdfc"), QC.actionsSheet("hdfc")],
  ["card-delete", "Delete", QC.detailsScreen("hdfc"), QC.deleteDialog("hdfc")],
  ["card-deleted", "Undo delete", homeView({body:list(QC.ORDER.filter(id => id !== "hdfc"))}), QC.toast("Card deleted","Undo",null,{nav:true})],
  ["home-note", "Note · 2 lines", noteView],
  ["home-note-copied", "Note held · copied", noteView, QC.toast("Note copied","Clear",null,{nav:true})],
  ["card-share-unlock", "Share · unlock", QC.detailsScreen("hdfc"), sysPrompt("Share card")],
  ["card-share", "Share · CVV off", QC.detailsScreen("hdfc"), shareDlg],
  ["card-share-sheet", "Share sheet", QC.detailsScreen("hdfc"), shareSheet],
  ["card-archive", "Archive · reason", QC.detailsScreen("icici"), archiveDlg],
  ["card-pinlimit", `Pin limit · if ${QC.PREFS.pinLimit} pinned`, QC.detailsScreen("icici"), QC.actionsSheet("icici", {pinnedCount:QC.PREFS.pinLimit})],
  ["home-repair", "Formats fixed", QC.homeBar() + QC.holderChips() + `<div class="content">${repairBanner}${tiles(QC.ORDER, checkOpts)}</div>` + QC.navbar("cards")],
  ["home-check", "Needs check", checkView],
  ["home-search-archived", "Archived in search", homeView({search:true, q:"axis", body:tiles(find("axis"))})]
]);

/* keep overlays in sync with the card opened in the live phone */
const syncOv = (p, id) => { p.querySelector("[data-sheet]").innerHTML = QC.actionsSheet(id); p.querySelector("[data-dialog]").innerHTML = QC.deleteDialog(id); QC.hydrate(p); };
let held = false, holdT = 0;
document.addEventListener("click", e => {
  if (held && e.target.closest("#home .tile-open")) { held = false; e.preventDefault(); e.stopPropagation(); return; }   /* the long-press already opened the sheet */
  const t = e.target.closest("#home [data-open]"); if (!t || e.target.closest("[data-copy],[data-p10-copy]")) return;
  const p = t.closest(".phone"); p.dataset.openCard = t.dataset.open; syncOv(p, t.dataset.open); }, true);
/* long-press (500ms, or the context-menu key) on a live tile opens its actions sheet. Compose: combinedClickable(onLongClick) + LONG_PRESS haptic */
const openActions = btn => { const p = btn.closest(".phone"), id = btn.dataset.open; p.dataset.openCard = id; syncOv(p, id);
  const tile = btn.closest(".tile"); tile.classList.remove("is-pressed"); p.querySelector("[data-sheet]").hidden = false; };
document.addEventListener("pointerdown", e => { const b = e.target.closest("#home .tile-open"); if (!b) return; held = false;
  const tile = b.closest(".tile"); tile.classList.add("is-pressed");
  holdT = setTimeout(() => { held = true; openActions(b); }, 500); });
["pointerup","pointercancel","pointerleave"].forEach(k => document.addEventListener(k, () => { clearTimeout(holdT); document.querySelectorAll("#home .tile.is-pressed").forEach(t => t.classList.remove("is-pressed")); }, true));
document.addEventListener("contextmenu", e => { const b = e.target.closest("#home .tile-open"); if (!b) return; e.preventDefault(); held = false; openActions(b); });

/* Recent: copy in place (state + polite announcement; no snackbar), and keep "Last used" + Recent current in the live phone */
const markUsed = (p, id) => {
  if (!p.matches("#home .phone, .phone[data-live]")) return;
  p.querySelectorAll(".tile .tile-flag.quiet").forEach(f => f.remove());
  const tile = p.querySelector(`.tile[data-card="${id}"]`), head = tile && tile.querySelector(".tile-head");
  if (head && !head.querySelector(".tile-flag") && !tile.querySelector(".tile-due")) head.insertAdjacentHTML("beforeend", `<span class="tile-flag quiet">Last used</span>`);
  const box = p.querySelector("[data-recent] .group"); if (!box) return;
  const ids = [id, ...[...box.querySelectorAll(".p10-rc")].map(r => r.dataset.card).filter(x => x !== id)].slice(0, 3);
  box.innerHTML = ids.map(x => rc(x)).join(""); QC.hydrate(box); };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-p10-copy]");
  if (b) { e.stopPropagation(); const r = b.closest(".p10-rc"), p = b.closest(".phone"), c = QC.CARDS[r.dataset.card];
    p.querySelectorAll(".is-copied").forEach(x => x.classList.remove("is-copied")); r.classList.add("is-copied");
    const live = p.querySelector(":scope > .qc-live"); if (live) { live.textContent = ""; setTimeout(() => { live.textContent = b.dataset.p10Copy; }, 50); }
    b.setAttribute("aria-label", `${c.bank} card number copied`);
    setTimeout(() => { r.classList.remove("is-copied"); b.setAttribute("aria-label", `Copy ${c.bank} card number ending ${c.last}`); markUsed(p, r.dataset.card); }, 1600);
    return; }
  const pill = e.target.closest("#home .pill-copy[data-copy]");
  if (pill) { const p = pill.closest(".phone"), id = pill.closest(".tile").dataset.card; setTimeout(() => markUsed(p, id), 1600); }
}, true);
/* Recent hides once the query has text, and returns when it is cleared */
const syncRecent = v => { const r = v && v.querySelector("[data-recent]"); if (r) r.hidden = !!v.querySelector(".appbar input").value.trim(); };
document.addEventListener("input", e => { if (e.target.closest("#home .appbar")) syncRecent(e.target.closest(".view")); });
document.addEventListener("click", e => { const a = e.target.closest("#home [data-act^=search]"); if (a) setTimeout(() => syncRecent(a.closest(".view")), 0); });
})();
</script>
<!-- 20-add: Add card (empty/live, filled, errors, more), Tap to add (NFC), Edit card, pickers, tags, filter, discard.

<style id="p20-css">

.content.p20-end{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:var(--s4)}
.p20-gh{display:flex;align-items:baseline;justify-content:space-between;font-size:var(--f2);line-height:var(--lh2);font-weight:var(--w-medium);color:var(--ink-2)}
.p20-count{font-size:var(--f1);line-height:var(--lh1);font-weight:var(--w-regular);font-variant-numeric:tabular-nums}

.p20-search .ic{color:var(--ink-2);width:var(--ic);height:var(--ic)}

.toast.p20-above-save{bottom:calc(var(--s2) + var(--lh2) + var(--s1) + var(--ctl-lg) + var(--s8) + var(--s2))}

  --p20-tint:var(--accent);background:color-mix(in oklab,var(--p20-tint) 14%,var(--surface-hi));box-shadow:0 0 0 var(--s5) color-mix(in oklab,var(--p20-tint) 14%,transparent),0 0 0 var(--s10) color-mix(in oklab,var(--p20-tint) 7%,transparent)}
.p20-ring .ic{width:var(--ic-lg);height:var(--ic-lg)}

.p20-read{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);font-size:var(--f3);line-height:var(--lh3)}
/* Round 8 (owner 6): each Tap to add state hugs its content (no reserved height); the footer sits 24 below the last line */
.p20-nfcmsg{display:flex;flex-direction:column;align-items:center}
/* preview digits: expiry wraps under the number at large text (same as .tile-foot) */
.p20-pvd{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:var(--s3)}
.p20-pvd .tile-exp{margin-left:0}
/* AUDIT6 P2-2: an expired number on the form keeps the card's colour in the Colour field; only the preview pass turns graphite with the Expired chip.
   Round 8 (owner 5): the preview shares the tile's header grid (bank | mark, meta | status chip), so the chip is in the one status slot */
.p20-pv .tile-head > [data-pv-net]{grid-column:2;grid-row:1;justify-self:end;align-self:start;display:flex}

.content.p20-ime{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:var(--s4)}   /* bottom-anchored at any font scale */
.p20-ime .stack > :nth-child(n+5){display:none}   /* the rows below the focused one sit under the keyboard */
.p20-ime + .p20-foot.sheet-actions.full.screen{padding-bottom:var(--s3)}
/* the keyboard is a system surface, drawn for context only (numeric IME for inputmode=numeric) */
.p20-kb{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);padding:var(--s2) var(--s2) var(--s6);background:var(--tonal-2)}
.p20-kb > span{height:var(--s12);display:grid;place-items:center;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--e1);font-size:var(--f4);line-height:var(--lh4);color:var(--ink)}

</style>
<section class="sec" id="sec-add" data-nav="Add card">
  <h2 class="sec-h">Add card</h2>
  <div class="shots" id="shots-add"></div>
</section>
<script>
document.head.appendChild(document.getElementById("p20-css")); /* survive ?shot= mode */
(function(){
const ic = QC.ic, H = QC.HUES;
const NET_ORDER = [["mir",/^220[0-4]/],["amex",/^3[47]/],["diners",/^3(0[0-5]|6|8|9)/],["jcb",/^35/],["visa",/^4/],["mc",/^(5[1-5]|2[2-7])/],
  ["discover",/^(6011|64[4-9]|65)/],["rupay",/^(60|81|82|508)/],["unionpay",/^62/],["maestro",/^(50|5[6-8]|6[37])/]];
const detect = d => { for (const [k,re] of NET_ORDER) if (re.test(d)) return k; return ""; };

/* ---------- form pieces ---------- */

/* ---------- validation (Round 3): rules per network, checked as you type ----------
   number: lengths per network + Luhn; an error shows once the number is complete for its network or the field is left.
   A number already in the vault is a blocking error with Open (Compose: PanHasher HMAC lookup, never the plain number).
   expiry: MM 01-12, not more than 20 years ahead; a past month is a warning ("Expired"), never a block. CVV: 4 digits Amex, else 3. */
const LENS = {visa:[13,16,19], mc:[16], rupay:[16], amex:[15], diners:[14,15,16,17,18,19], discover:[16,17,18,19], jcb:[16,17,18,19], maestro:[12,13,14,15,16,17,18,19], mir:[16,17,18,19], unionpay:[16,17,18,19]};
const ANY = [12,13,14,15,16,17,18,19];
const luhn = d => { let s = 0; for (let i = 0; i < d.length; i++) { let n = +d[d.length-1-i]; if (i % 2) { n *= 2; if (n > 9) n -= 9; } s += n; } return s % 10 === 0; };
const NOW = {m:QC.TODAY.m, y:QC.TODAY.y % 100};   /* the prototype's one today (QC.TODAY): Nov 2026 */
const saved = d => Object.values(QC.CARDS).find(c => c.groups.join("") === d);
const lenText = k => { const l = LENS[k]; return l.length === 1 ? `${l[0]}` : l.length === 3 && k === "visa" ? "13, 16 or 19" : `${l[0]} to ${l[l.length-1]}`; };
/* check(field, value, {net, done}) -> {kind:"err"|"warn"|"", msg, card} ; done = the user left the field */
function check(f, v, o={}) {
  const d = String(v).replace(/\D/g, "");
  if (f === "number") { const k = o.net || detect(d), lens = LENS[k] || ANY, max = lens.includes(16) ? 16 : Math.max(...lens);   /* the usual length; longer allowed lengths re-check as typing goes on */
    if (!d) return {kind: o.done ? "err" : "", msg: "Enter the number"};
    const complete = d.length >= max || o.done;
    if (!complete) return {kind:"", msg:""};
    const c = saved(d); if (c) return {kind:"err", msg:`Already saved as ${c.bank} ${QC.masked(c.last)}`, card:c};
    if (!lens.includes(d.length)) return {kind:"err", msg: k ? `${QC.NETNAME[k]} numbers have ${lenText(k)} digits` : "Use 12 to 19 digits"};
    if (!luhn(d)) return {kind:"err", msg:"Check the digits"};
    return {kind:"", msg:"", ok:true}; }
  if (f === "exp") { if (d.length < 4) return {kind: o.done && d ? "err" : "", msg:"Use MM/YY"};
    const m = +d.slice(0,2), y = +d.slice(2,4);
    if (m < 1 || m > 12) return {kind:"err", msg:"Month: 1 to 12"};   /* AUDIT4 P2-6: "Use MM/YY" only for a bad shape */
    if (y > NOW.y + 20) return {kind:"err", msg:"Check the year"};
    if (y < NOW.y || (y === NOW.y && m < NOW.m)) return {kind:"warn", msg:"Expired", ok:true};
    return {kind:"", msg:"", ok:true}; }
  if (f === "cvv") { const n = o.net === "amex" ? 4 : 3;
    if (d.length === n) return {kind:"", msg:"", ok:true};
    return {kind: (o.done && d.length) || d.length > n ? "err" : "", msg:`Enter ${n} digits`}; }
  return {kind:"", msg:"", ok: !!v};
}
/* Round 4: the one line above a disabled Save names the first thing missing, in form order */
function missing(f, e={}) {
  const net = detect(String(f.number||"").replace(/\D/g, ""));
  if (!f.holder) return "Choose a holder";
  if (!f.number) return "Add the number";
  if (e.number || !check("number", f.number, {net, done:1}).ok) return "Check the number";
  if (!f.exp) return "Add the expiry";
  if (e.exp || !check("exp", f.exp, {done:1}).ok) return "Check the expiry";
  if (!f.cvv || String(f.cvv).length < (net === "amex" ? 4 : 3)) return "Add the CVV";
  if (e.cvv || !check("cvv", f.cvv, {net, done:1}).ok) return "Check the CVV";
  if (!f.bank) return "Choose a bank";
  if (!f.type) return "Choose a type";
  return "";
}
let hid = 0;
const setHelp = (inp, r) => { const tf = inp.closest(".tf"); tf.classList.toggle("is-error", r.kind === "err"); tf.classList.toggle("is-warn", r.kind === "warn");
  let h = tf.querySelector(":scope > .tf-help");
  if (!r.kind) { if (h) h.remove(); inp.removeAttribute("aria-invalid"); inp.removeAttribute("aria-describedby"); return; }
  if (!h) { h = document.createElement("span"); h.id = "p20h-" + (++hid); tf.appendChild(h); }
  const act = r.card ? `<button class="btn btn-text" data-p20-openc="${r.card.id}" aria-label="Open ${r.card.bank} card ending ${r.card.last}">Open</button>` : "";
  h.className = "tf-help" + (act ? " has-act" : ""); if (r.kind === "err") h.setAttribute("role", "alert"); else h.removeAttribute("role");
  h.innerHTML = act ? `<span>${r.msg}</span>${act}` : r.msg;
  inp.setAttribute("aria-describedby", h.id); if (r.kind === "err") inp.setAttribute("aria-invalid", "true"); else inp.removeAttribute("aria-invalid"); };
/* Save card turns on only when every required field is valid */
const syncSave = ph => { const q = k => ph.querySelector(`[data-p20="${k}"]`); if (!q("number")) return;
  const net = detect(q("number").value.replace(/\D/g, ""));
  const why = missing({holder:q("holder").value, number:q("number").value, exp:q("exp").value, cvv:q("cvv").value, bank:q("bank").value, type:q("type").value}), ok = !why;
  const b = ph.querySelector("[data-p20-save]"); b.disabled = !ok; b.classList.toggle("is-disabled", !ok); b.setAttribute("aria-disabled", String(!ok));
  const n = ph.querySelector(".p20-foot [data-note]"); if (n) { n.textContent = why; n.hidden = ok; } };

  if (/number|exp|cvv/.test(f)) setHelp(inp, check(f, inp.value, {net, done}));
