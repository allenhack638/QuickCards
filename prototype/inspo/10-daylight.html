  <tr><td>Tile and pill are separate focus targets; nothing interactive inside another</td><td class="mono">Box { Tile(Modifier.clickable) ; CopyPill(Modifier.clickable) } · no mergeDescendants · tile customActions = [Copy card number]</td></tr>
  <tr><td>A field error belongs to its field</td><td class="mono">OutlinedTextField(isError = true, supportingText) · semantics { error(msg) }</td></tr>
  <tr><td>Every screen title is a heading (1); sheet and dialog titles and list section labels too (2; labels inside a sheet 3)</td><td class="mono">Modifier.semantics { heading() }</td></tr>
  <tr><td>Picker fields (Holder, Bank, Type, Colour) are buttons that open the picker sheet, not read-only text boxes: “Holder, Diya Mehta, double-tap to choose”</td><td class="mono">Modifier.clickable(role = Role.DropdownList, onClickLabel = "Choose") · stateDescription = value ?: "Not set" · opens QcPickerSheet (ExposedDropdownMenuBox is forbidden outside the Qc wrappers)</td></tr>
  <tr><td>Autofill “Search all N cards…” is an option like the cards</td><td class="mono">Dataset + setAuthentication(IntentSender)</td></tr>
  <tr><td>Password rules read as a checklist; Export waits for both</td><td class="mono">supportingText per rule · Button(enabled = len ≥ 8 &amp;&amp; match)</td></tr>
  <tr><td>Every switch, chip and icon target ≥ 48×48</td><td class="mono">minimumInteractiveComponentSize()</td></tr>
  <tr><td>A screen without a visible title still has one for TalkBack: card details = “HDFC Bank card ending 0366”</td><td class="mono">Modifier.semantics { paneTitle = …; heading() }</td></tr>
  <tr><td>Note on the pass: at most 2 lines with an ellipsis (no More/Less); TalkBack reads the whole note; the full note is on Card details; the hold to copy is a custom action “Copy note”</td><td class="mono">Text(maxLines = 2, overflow = Ellipsis) · customActions</td></tr>
  <tr><td>Share “Include CVV” switch: “Off. Only if the person needs it.”</td><td class="mono">stateDescription</td></tr>
  <tr><td>A disabled row says why in its own line (Pin · “10 of 10 pinned”)</td><td class="mono">ListItem(enabled = false, supportingContent)</td></tr></table>
  <div class="cmp-spec">prototype: one .sr role=status per phone · aria-invalid + aria-describedby on the input · open = full-bleed sibling button under the pill</div>`, "wide"));

/* motion */
F.push(box("Motion · three durations", `<table class="tbl"><tr><th>Token</th><th>Value</th><th>Use</th></tr>
  <tr><td class="mono">--dur-state</td><td class="mono">150ms</td><td>Copy → check + "Copied", press layers, switch</td></tr>
  <tr><td class="mono">--dur-nav</td><td class="mono">200ms</td><td>Screen fade + 16 dp slide, sheet/dialog in</td></tr>
  <tr><td class="mono">--dur-toast</td><td class="mono">3000ms</td><td>Toast on screen (4.5 s with TalkBack)</td></tr>
  <tr><td class="mono">--ease</td><td class="mono">(.2,0,0,1)</td><td>Emphasized decelerate; reduced motion (targeted, not a global kill) = no slides and no switch-thumb travel, crossfades stay, spinner slows to 2400ms</td></tr></table>
  <div class="cmp-spec">nothing moves on its own · no tilt, particles, rolling digits or flips · reveal drain is the only timed line</div>`));

/* compose map */
const CM = [["--bg / --surface / --surface-hi","colorScheme.background / surface / surfaceContainerHigh"],["--tonal / --tonal-2","surfaceContainer / surfaceContainerHighest"],
 ["--ink / --ink-2","onSurface / onSurfaceVariant"],["--outline / --line","outline / outlineVariant"],["--accent","primary (text buttons, focus, caret)"],["--brand","QcColors.brand (filled CTA only)"],
 ["--danger / --danger-bg","error / errorContainer"],["--inverse / --on-inverse / --inverse-accent","inverseSurface / inverseOnSurface / inversePrimary"],["--select / --on-select","QcColors.select (Switch/Checkbox/Radio colors)"],
 ["--f1 … --f5","Typography labelSmall, bodyMedium, bodyLarge, titleLarge, headlineSmall"],["--s1 … --s16","QcSpacing.s1 … s16 (Dp)"],["--r-xs … --r-xl, --r-full","Shapes extraSmall … extraLarge, CircleShape"],
 ["--e1 / --e2 / --e3","tonalElevation 0/2/3 dp + Modifier.shadow (light only)"],["QC.HUES","QcCardArt.hues: c1, c2, glow, pattern"],["QC.pattern()","Canvas drawCircle / drawPath strokes, 1.dp"],
 ["grain","bundled 160×160 noise bitmap, BlendMode.Overlay 14%"],["mark tone","Image(net_x) or Image(net_x_mono, ColorFilter.tint(White))"],["--dur-state / --dur-nav","tween(150) / tween(200, EmphasizedDecelerate)"],
 [".toast","SnackbarHost + Snackbar (M3, no icon), shape r-md, inverse colours"],[".sheet / .dialog / .menu","QcModalBottomSheet / QcDialog / QcDropdownMenu wrappers"],["Last used / Recent","CardEntity.lastCopiedAt; recent = top 3 by lastCopiedAt"],["long-press tile","Modifier.combinedClickable(onLongClick) + HapticFeedbackType.LongPress"],["launcher shortcuts","Add card, Search: static (res/xml/shortcuts.xml) · Tap to add: dynamic, pushed with ShortcutManagerCompat only when the phone has NFC"],["tips","HorizontalPager(3) + a DataStore flag tipsSeen"],["field warning","supportingText in QcColors.warn, isError = false"],["QC.sheetActions","QcSheetActions: Row of full-width FilledTonalButton / Button, 24.dp sides (screen: 16.dp, editors' Save)"],["QC.net(k, \"slot\")","Box(40×24.dp) + trimmed net_k, ContentScale.Fit"],[".qc-live","announceForAccessibility / LiveRegionMode.Polite"],["--ink-ph","TextField placeholder colour"],["hit 48","Modifier.minimumInteractiveComponentSize()"]];
F.push(box("Compose mapping", `<div class="tbl-wrap"><table class="tbl"><tr><th>Token</th><th>Compose</th></tr>${CM.map(r=>`<tr><td class="mono">${r[0]}</td><td class="mono">${r[1]}</td></tr>`).join("")}</table></div>`, "wide"));
document.getElementById("fnd").innerHTML = F.join("");
})();
</script>
</main>
<script>
/* =====================================================================
   99-foot: boot. Order: sprites -> theme -> shot -> hydrate -> nav -> wire
   ===================================================================== */
(function(){
const P = new URLSearchParams(location.search);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

/* 1. sprites: icon symbols + network marks (colour symbol + white-tone mask) */
(function sprites(){
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute"><defs>';
  for (const [n,d] of Object.entries(QC.ICONS)) s += `<symbol id="i-${n}" viewBox="0 -960 960 960"><path d="${d}"/></symbol>`;
  for (const [n,g] of Object.entries(QC.NETS)) {
    s += `<symbol id="n-${n}" viewBox="0 0 56 28">${g}</symbol>`;
    /* white tone: white fills knock out (black in the mask), every other fill paints white; paint order kept */
    const m = g.replace(/fill="([^"]+)"/g, (_, f) => /^#(fff|ffffff|fefefe)$/i.test(f) ? 'fill="#000"' : 'fill="#fff"');
    s += `<mask id="nw-${n}" maskUnits="userSpaceOnUse" x="0" y="0" width="56" height="28"><rect width="56" height="28" fill="#000"/>${m}</mask>`;
  }
  s += '</defs></svg>';
  document.getElementById('qc-sprites').innerHTML = s;
})();

/* 2. theme */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $$('[data-theme-set]').forEach(b => b.classList.toggle('is-on', b.dataset.themeSet === t));
}
setTheme(P.get('theme') === 'dark' ? 'dark' : 'light');
document.addEventListener('click', e => { const b = e.target.closest('[data-theme-set]'); if (b) setTheme(b.dataset.themeSet); });

/* 2b. ?fs=2 previews the Android font scale: sp tokens (type sizes, line heights) scale, dp tokens do not */
const FS = parseFloat(P.get('fs'));
if (FS > 1) { const cs = getComputedStyle(document.documentElement);
  for (const k of ['f1','f2','f3','f4','f5','lh1','lh2','lh3','lh4','lh5']) document.documentElement.style.setProperty('--'+k, (parseFloat(cs.getPropertyValue('--'+k)) * FS) + 'px'); }

/* 3. shot mode: ?shot=<figure id> keeps only that phone */
const shot = P.get('shot');
if (shot) {
  const fig = document.getElementById(shot);
  const phone = fig && (fig.matches('.phone') ? fig : fig.querySelector('.phone'));
  if (phone) {
    const keep = document.getElementById('qc-sprites');
    [...document.body.children].forEach(el => { if (el !== keep && el.tagName !== 'SCRIPT') el.remove(); });
    document.body.classList.add('shot-mode');
    document.body.appendChild(phone);
  }
}

/* 4. hydrate (exported so parts can re-run it after injecting HTML) */
const SB = `<span>9:41</span><span class="sb-sys">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5 1.5 8.6a15 15 0 0 1 21 0z"/></svg>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 3v18H4z"/></svg>
  <svg width="20" height="16" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1" y="2" width="22" height="12" rx="3"/><rect x="3.5" y="4.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M25.5 6v4"/></svg></span>`;
QC.hydrate = function(root=document){
  $$('.phone', root).forEach(p => {
    if (!p.querySelector(':scope > .sb')) p.insertAdjacentHTML('afterbegin', `<div class="sb">${SB}</div>`);
    if (!p.querySelector(':scope > .gh')) p.insertAdjacentHTML('beforeend', '<div class="gh"></div>');
    /* P1-1: one polite live region per phone announces in-place copies (Compose: announceForAccessibility / LiveRegionMode.Polite) */
    if (!p.querySelector(':scope > .qc-live')) p.insertAdjacentHTML('beforeend', '<div class="sr qc-live" role="status" aria-live="polite"></div>');
  });
  /* P2-3 heading rule (Compose: Modifier.semantics { heading() }): screen titles 1, sheet + dialog titles and screen section labels 2, labels inside a sheet 3.
     Builders set it; this catches titles written inline by a part. */
  $$('.appbar-title:not(:empty), .sheet-title, .dialog-title, .group-label, .empty-title, .first-title, .p10-line', root).forEach(h => {
    if (h.hasAttribute('role')) return;
    const lvl = h.matches('.appbar-title') ? 1 : h.matches('.group-label') && h.closest('.sheet,.dialog') ? 3 : 2;
    h.setAttribute('role', 'heading'); h.setAttribute('aria-level', lvl); });
  $$('i.ic[data-i]', root).forEach(i => { const t = document.createElement('template'); t.innerHTML = QC.ic(i.dataset.i, i.className.replace(/\bic\b/, '')); i.replaceWith(t.content); });
  /* Round 8 (owner 5): on a pass header (tile, hero, form preview) the mark's ARTWORK right edge sits on the content edge (= Copy pill and status
     chip right edge): the 56x28 canvas is shifted so the logo's own right bound lands at x 52 (the canvas overhangs the edge by 4) */
  $$('.net[data-net]:empty', root).forEach(n => { const k = n.dataset.net, nb = QC.NETBOX[k] && QC.NETBOX[k].split(' ').map(Number);
    const head = !n.classList.contains('slot') && n.closest('.tile-head') && nb;
    /* the logo grows (never shrinks) to fill the 48x20 logo box, centred on the canvas mid-line */
    const hs = head ? Math.max(1, Math.min(48 / nb[2], 20 / nb[3])) : 1;
    const vb = n.classList.contains('slot') && nb ? QC.NETBOX[k] : head ? `${+(nb[0] + nb[2] - 52 / hs).toFixed(2)} ${+(nb[1] + nb[3] / 2 - 14 / hs).toFixed(2)} ${+(56 / hs).toFixed(2)} ${+(28 / hs).toFixed(2)}` : '0 0 56 28';
    n.innerHTML = `<svg class="tc" viewBox="${vb}" aria-hidden="true"><use href="#n-${k}" width="56" height="28"/></svg><svg class="tw" viewBox="${vb}" aria-hidden="true"><rect width="56" height="28" fill="#fff" mask="url(#nw-${k})"/></svg>`; });
  $$('.art', root).forEach(a => {
    if (a.querySelector(':scope > .art-bg')) return;
    const hue = QC.HUES[a.dataset.hue] || QC.HUES.navy;
    if (!a.style.getPropertyValue('--c1')) a.setAttribute('style', (a.getAttribute('style')||'') + `;--c1:${hue.c1};--c2:${hue.c2};--glow:${hue.glow}`);
    let w = a.offsetWidth, h = a.offsetHeight;
    if (a.classList.contains('mini') || w < 120) { w = 328; h = 207; }
    if (!w || !h) { w = 328; h = a.classList.contains('hero') ? 207 : 136; }
    /* Round 8 (owner 2): the pattern follows the colour (band key, or a custom hex hashed to a stable index); nothing passes a pattern */
    const pat = QC.HUES[a.dataset.hue] ? hue.pat : QC.patFor(a.style.getPropertyValue('--c2').trim() || hue.c2);
    a.insertAdjacentHTML('afterbegin', `<div class="art-bg"></div>${QC.pattern(pat, w, h)}<div class="art-grain"></div>`);
  });
  QC.fillIcons(root);
  QC.afterLayout(root);
};
/* Round 8 (owner 9): list, row and leading icons in Settings, Manage, sheets, dialogs, banners and pickers are Material Symbols Rounded FILL 1
   (weight 400, optical size 24), same colour token as before. Controls (checkbox, radio, switch) and buttons keep their own glyphs.
   The navigation bar follows M3 (selected filled, others outlined; QC.navbar). Compose: Icons.Rounded.* (filled) */
QC.fillIcons = function(root=document){
  $$('.row-lead .ic, .row-trail .ic, .banner > .ic, .p20-search > .ic, [data-p25-bankchip] > .ic', root).forEach(s => {
    if (s.closest('.cb, .rd, .sw, .btn, .ibtn')) return;
    const u = s.querySelector('use'), n = u && (u.getAttribute('href') || '').replace('#i-', '');
    if (n && !n.endsWith('-fill') && QC.ICONS[n + '-fill']) u.setAttribute('href', '#i-' + n + '-fill');
  });
};
/* Round 6: layout-dependent passes (dialog scroll hairlines, staggered grids). Parts push functions onto QC.LAYOUT; re-run after fonts */
QC.LAYOUT = QC.LAYOUT || [];
QC.afterLayout = function(root=document){
  $$('.dialog-scroll', root).forEach(s => s.classList.toggle('is-scroll', s.scrollHeight > s.clientHeight + 1));
  QC.LAYOUT.forEach(f => f(root));
};
QC.hydrate();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { QC.afterLayout(); });

/* 5. section nav from <section data-nav="Label" id=...> */
const nav = document.getElementById('secnav');
if (nav) nav.innerHTML = $$('section[data-nav]').map(s => `<a href="#${s.id}">${s.dataset.nav}</a>`).join('');

/* 6. interactions (delegated; work in any phone) */
const timers = new WeakMap();
QC.showToast = function(phone, html){
  let t = phone.querySelector('.toast[data-live]');
  const tmp = document.createElement('template'); tmp.innerHTML = html.trim(); const n = tmp.content.firstElementChild; n.dataset.live = '';
  if (t) t.replaceWith(n); else phone.appendChild(n);
  QC.hydrate(phone);
  clearTimeout(timers.get(phone));
  timers.set(phone, setTimeout(() => n.classList.add('is-hidden'), 3000));
  return n;
};
function copied(btn){
  const phone = btn.closest('.phone'); if (!phone) return;
  const holder = btn.closest('.drow') || btn;
  $$('.is-copied', phone).forEach(e => e.classList.remove('is-copied'));
  holder.classList.add('is-copied');
  setTimeout(() => holder.classList.remove('is-copied'), 1600);
  /* in-place feedback (tile pill, details row) is the confirmation: no toast, but TalkBack hears it (polite live region)
     and the button's name reads the copied state until it resets */
  if (holder.matches('.drow, .pill-copy')) {
    const said = btn.dataset.copy || 'Copied', live = phone.querySelector(':scope > .qc-live');
    if (live) { live.textContent = ''; setTimeout(() => { live.textContent = said; }, 50); }
    if (!btn.dataset.label) btn.dataset.label = btn.getAttribute('aria-label') || '';
    btn.setAttribute('aria-label', said);
    clearTimeout(btn._qcT); btn._qcT = setTimeout(() => btn.setAttribute('aria-label', btn.dataset.label), 1600);
    return;
  }
  const cardEl = btn.closest('[data-card]');
  const view = btn.closest('.view') || phone;
  const hasNav = !!view.querySelector('.navbar') && !phone.querySelector('.appbar.is-search');
  QC.showToast(phone, QC.toast(btn.dataset.copy || 'Copied', 'Clear', cardEl ? cardEl.dataset.card : {icon:'check'}, {nav: hasNav}));
}
function filter(appbar){
  const view = appbar.closest('.view') || appbar.closest('.app');
  /* P1-2: digits anywhere in the number (spaces ignored), bank, holder, network, type, tag, note. Results still show only the last 4 */
  const q = appbar.querySelector('input').value.trim().toLowerCase(), qd = q.replace(/\s+/g, ''); let n = 0;
  $$('.tile[data-q]', view).forEach(t => { const hit = !q || t.dataset.q.includes(q) || (/^\d+$/.test(qd) && (t.dataset.d || '').includes(qd)); t.hidden = !hit; n += hit; });
  const nr = view.querySelector('[data-noresult]'); if (nr) nr.hidden = n > 0;
}
function go(phone, name){
  const views = $$('.view', phone); const to = views.find(v => v.dataset.view === name); if (!to) return;
  views.forEach(v => { if (v !== to) { v.classList.add('is-off'); v.classList.toggle('is-back', name === 'details'); } });
  to.classList.remove('is-off', 'is-back');
}
/* note on the pass (2 lines + ellipsis, no More/Less): a 500 ms hold copies it ("Note copied"); a tap opens the card */
let noteT = 0, noteHeld = false;
document.addEventListener('pointerdown', e => { const n = e.target.closest('[data-note-hold]'); if (!n) return; noteHeld = false; n.classList.add('is-pressed');
  noteT = setTimeout(() => { noteHeld = true; n.classList.remove('is-pressed'); const phone = n.closest('.phone'); if (!phone) return;
    const view = n.closest('.view') || phone; const nav = !!view.querySelector('.navbar') && !view.querySelector('.appbar.is-search');
    QC.showToast(phone, QC.toast('Note copied', 'Clear', null, {nav})); }, 500); });
['pointerup','pointercancel','pointerleave'].forEach(k => document.addEventListener(k, () => { clearTimeout(noteT); $$('[data-note-hold].is-pressed').forEach(n => n.classList.remove('is-pressed')); }, true));
document.addEventListener('click', e => {
  const t = e.target;
  const nh = t.closest('[data-note-hold]');
  if (nh) { if (noteHeld) { noteHeld = false; return; } const open = nh.closest('.tile') && nh.closest('.tile').querySelector('.tile-open'); if (open) open.click(); return; }
  const cp = t.closest('[data-copy]'); if (cp) { e.stopPropagation(); copied(cp); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act, phone = act.closest('.phone');
    const bar = act.closest('.appbar') || (phone && (act.closest('.view') || phone).querySelector('.appbar.is-search'));
    if (a === 'search' && bar) { bar.classList.add('is-search'); (bar.closest('.view')||phone).classList.add('is-searching'); bar.querySelector('input').focus(); }
    if (a === 'search-close' && bar) { bar.classList.remove('is-search'); (bar.closest('.view')||phone).classList.remove('is-searching'); bar.querySelector('input').value = ''; filter(bar); }
    if (a === 'search-clear' && bar) { const i = bar.querySelector('input'); i.value = ''; filter(bar); i.focus(); }
    if (a === 'back' && phone) go(phone, 'home');
    if (a === 'sheet' && phone) { const s = phone.querySelector('[data-sheet]'); if (s) s.hidden = false; }
    if (a === 'close-overlay' && phone) $$('[data-sheet],[data-dialog]', phone).forEach(o => o.hidden = true);
    if (a === 'delete' && phone) { $$('[data-sheet]', phone).forEach(o => o.hidden = true); const d = phone.querySelector('[data-dialog]'); if (d) d.hidden = false; }
    if (a === 'confirm-delete' && phone) {
      $$('[data-dialog]', phone).forEach(o => o.hidden = true);
      const id = phone.dataset.openCard; const tile = phone.querySelector(`.tile[data-card="${id}"]`);
      go(phone, 'home'); if (tile) tile.hidden = true;
      const toast = QC.showToast(phone, QC.toast('Card deleted', 'Undo', {icon:'delete'}, {nav:true}));
      toast.querySelector('.toast-act').addEventListener('click', () => { if (tile) tile.hidden = false; toast.classList.add('is-hidden'); });
    }
    return;
  }
  const open = t.closest('[data-open]');
  if (open) { const phone = open.closest('.phone'); const slot = phone && phone.querySelector('[data-details-slot]');
    if (slot) { phone.dataset.openCard = open.dataset.open; slot.innerHTML = QC.detailsScreen(open.dataset.open); QC.hydrate(slot); go(phone, 'details'); } }
});
document.addEventListener('input', e => { const bar = e.target.closest('.appbar.is-search'); if (bar) filter(bar); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-open]')) e.target.click(); });
})();
</script>
