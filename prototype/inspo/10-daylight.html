<script>
document.head.appendChild(document.getElementById("p25-css")); /* survive ?shot= mode */
(function(){
const ic = QC.ic, H = QC.HUES;

/* ======================================================================
   DATA (E2). Built-in banks (domain BankCatalog, 26) -> a fixed jewel band.
   Echoes the brand hue without copying it; every band keeps white text >= 7:1 on its light stop.
   Where a brand has no jewel echo, the bank takes the next band in PALETTE_ORDER that the
   catalog had not used yet. Graphite is never a default: it marks expired cards and the empty form.
   ====================================================================== */
QC.BANK_COLOURS = {
  "HDFC Bank":"navy", "SBI Card":"ocean", "ICICI Bank":"rust", "Axis Bank":"wine", "Kotak Mahindra Bank":"crimson",
  "IndusInd Bank":"plum", "RBL Bank":"violet", "IDFC FIRST Bank":"magenta", "Bank of Baroda":"rust", "Yes Bank":"indigo",
  "AU Small Finance Bank":"burnt_orange", "Federal Bank":"olive", "Bandhan Bank":"moss", "Punjab National Bank":"forest",
  "Canara Bank":"teal", "Union Bank of India":"slate",
  "American Express":"ocean", "HSBC":"crimson", "Standard Chartered":"teal", "Citibank":"navy", "Chase":"indigo",
  "Capital One":"slate", "Bank of America":"wine", "Barclays":"ocean", "Wells Fargo":"burnt_orange", "DBS Bank":"crimson"
};
/* aliases people type (BankCatalog.aliases, abbreviated) */
const ALIAS = {"hdfc":"HDFC Bank","sbi":"SBI Card","state bank of india":"SBI Card","icici":"ICICI Bank","axis":"Axis Bank","kotak":"Kotak Mahindra Bank",
  "indusind":"IndusInd Bank","rbl":"RBL Bank","idfc":"IDFC FIRST Bank","idfc first":"IDFC FIRST Bank","bob":"Bank of Baroda","yes":"Yes Bank",
  "au":"AU Small Finance Bank","au bank":"AU Small Finance Bank","federal":"Federal Bank","bandhan":"Bandhan Bank","pnb":"Punjab National Bank",
  "canara":"Canara Bank","union bank":"Union Bank of India","amex":"American Express","citi":"Citibank","dbs":"DBS Bank"};
const key = s => String(s||"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/[^\p{L}\p{N}]+/gu," ").trim();
/* the fixed logical order: blues -> greens -> earth -> reds -> purples -> neutral slate (colour wheel, cool first) */
QC.PALETTE_ORDER = ["navy","ocean","teal","forest","moss","olive","burnt_orange","rust","crimson","wine","magenta","plum","violet","indigo","slate"];
/* user banks: name -> band they were given (made-up) */
QC.USER_BANKS = {};
/* default band for any bank name: user bank > built-in > null */
QC.bankColour = name => { if (!name) return null; if (QC.USER_BANKS[name]) return QC.USER_BANKS[name];
  if (QC.BANK_COLOURS[name]) return QC.BANK_COLOURS[name];
  const k = key(name); for (const b in QC.BANK_COLOURS) if (key(b) === k) return QC.BANK_COLOURS[b];
  return ALIAS[k] ? QC.BANK_COLOURS[ALIAS[k]] : null; };
/* E3. auto-default for a NEW bank, given the bands the bank list already uses (built-in + user, one entry per bank):
   1) the first band in PALETTE_ORDER that no bank uses; 2) otherwise the least-used band, ties -> earlier in the order. */
QC.autoBankColour = used => { const n = {}; QC.PALETTE_ORDER.forEach(k => n[k] = 0); used.forEach(k => { if (k in n) n[k]++; });
  return QC.PALETTE_ORDER.find(k => !n[k]) || QC.PALETTE_ORDER.reduce((a, k) => n[k] < n[a] ? k : a); };

/* custom band from hue (0-360) and lightness (0-1): c2 = light stop (white text sits on it), c1 = deep stop */
const hsl2hex = (h, s, l) => { s/=100; l/=100; const k = n => (n + h/30) % 12, a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  return "#" + [f(0),f(8),f(4)].map(v => Math.round(v*255).toString(16).padStart(2,"0")).join("").toUpperCase(); };

/* where the 7:1 guard starts on the lightness strip, for a hue */
const limitAt = hue => { for (let i = 0; i <= 200; i++) { if (custom(hue, i/200).ratio < 7) return (i-1)/200; } return 1; };
const band = h => typeof h === "string" ? {...H[h], key:h} : h;

/* ======================================================================
   BUILDERS
   ====================================================================== */
const chip = (h, cls="xs") => { const b = band(h); return `<span class="art p25-card ${cls}" data-hue="${b.key||"custom"}" style="--c1:${b.c1};--c2:${b.c2};--glow:${b.glow}" aria-hidden="true"></span>`; };
/* Colour field (Add / Edit card, bank editor). Empty = follows the bank (placeholder "Bank colour"). */
const colourField = (h, o={}) => { const b = h ? band(h) : null;
  return QC.tf("Colour", b ? (b.name||"Custom") : "", {pick:1, ph:o.ph||"Bank colour", help:o.help,
    lead:`<span class="p25-chipslot" data-p25-chip>${b ? chip(b) : ""}</span>`, data:'data-p25-colour', cls:"p25-cf"}); };
/* preview pass. p = {bank, net, last, hue} */
const preview = (p={}) => { const b = band(p.hue || "graphite");
  return `<div class="art p25-pv" data-hue="${b.key||"custom"}" style="--c1:${b.c1};--c2:${b.c2};--glow:${b.glow}" data-p25-pv role="img" aria-label="Preview">
    <div class="p25-pv-top"><span class="p25-pv-bank" data-p25-pv-bank>${p.bank||"New card"}</span>${p.net?QC.net(p.net,"sm"):""}</div>
    <span class="num p25-pv-num"><span class="dots">••••</span><span${p.last?"":' class="t2"'}>${p.last||"0000"}</span></span></div>`; };
const swatch = (k, on, bankKey) => `<button class="p25-sw${on?" is-on":""}" role="radio" aria-checked="${!!on}" data-p25-hue="${k}" aria-label="${H[k].name}${k===bankKey?", bank colour":""}">
  ${chip(k, "").replace('aria-hidden="true">', `aria-hidden="true">${k===bankKey?ic("account_balance","xs p25-bk"):""}${ic("check")}`)}<span class="p25-nm">${H[k].name}</span></button>`;
/* the Colour sheet. o = {on (band key | "custom"), bankHue (the bank's default; shows the chip + glyph), pv (preview props), live} */
const ORDER_UI = [...QC.PALETTE_ORDER, "graphite"];
const pickerBody = (o) => `<div class="sheet-head p25-head"><div class="sheet-title" style="flex:1">Colour</div>${o.bankHue ?
    `<button class="chip${o.on===o.bankHue?" is-on":""}" data-p25-bankchip aria-pressed="${o.on===o.bankHue}">${ic("account_balance")}Bank colour</button>` : ""}</div>
  ${preview({...o.pv, hue: o.on==="custom" ? o.custom : o.on})}
  <div class="p25-grid" role="radiogroup" aria-label="Colour">${ORDER_UI.map(k => swatch(k, k===o.on, o.bankHue)).join("")}
    <button class="p25-sw${o.on==="custom"?" is-on":""}" role="radio" aria-checked="${o.on==="custom"}" data-p25-custom aria-label="Custom colour"><span class="p25-card p25-cust">${ic("palette")}</span><span class="p25-nm">Custom</span></button></div>
  ${QC.sheetActions({primary:"Done", attrs:'data-p25-done'})}`;
/* custom view. s = {hue, t, pv} */
const customBody = (s) => { const c = custom(s.hue, s.t), bad = c.ratio < 7, lim = limitAt(s.hue), gid = "p25-guard-" + (QC._p25g = (QC._p25g || 0) + 1);
  const hueG = "linear-gradient(90deg," + [0,30,60,90,120,150,180,210,240,270,300,330,360].map(h => hsl2hex(h,58,40)).join(",") + ")";
  const litG = `linear-gradient(90deg,${hsl2hex(s.hue,58,L0)},${hsl2hex(s.hue,58,(L0+L1)/2)},${hsl2hex(s.hue,58,L1)})`;
  return `<div class="sheet-head p25-head">${QC.ibtn("arrow_back","Back to colours",'data-p25-back')}<div class="sheet-title" style="flex:1">Custom colour</div></div>
  <div class="p25-cv" data-p25-cv data-hue-v="${s.hue}" data-t="${s.t}">
  ${preview({...s.pv, hue:c})}
  <div class="p25-strip" data-p25-strip="hue" role="slider" tabindex="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="360" aria-valuenow="${Math.round(s.hue)}" style="--p25-g:${hueG}"><span class="p25-thumb" style="left:${s.hue/3.6}%;--p25-c:${hsl2hex(s.hue,58,40)}"></span></div>
  <div class="p25-strip" data-p25-strip="lit" role="slider" tabindex="0" aria-label="Lightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(s.t*100)}" style="--p25-g:${litG}"><span class="p25-lim" style="left:${lim*100}%"></span><span class="p25-thumb" style="left:${s.t*100}%;--p25-c:${c.c2}"></span></div>

if (QC.onColours) QC.onColours();

/* ======================================================================

   ====================================================================== */
const F = QC.p20;   /* exported by 20-add: form(f, e, o), foot(label, dis), bar.add/edit, data */
const icici = {bank:"ICICI Bank", net:"visa", last:"2205"};
const pvAxis = {bank:"Axis Bank", net:"rupay", last:"9021"};
/* Manage › Banks: derived from the one dataset; counts include archived cards, like every Manage list (Axis 2, HDFC 1, ICICI 1, SBI 2) */
const BANKS = [...new Set(QC.STORED.map(id => QC.CARDS[id].bank))].sort().map(b => [b, QC.cards(QC.count(c => c.bank === b, {archived:true}))]);
const usedNow = BANKS.map(([b]) => QC.bankColour(b));
const NEW_BANK = "Saraswat Bank";
const autoHue = QC.autoBankColour(usedNow);          /* -> teal: navy (HDFC) and ocean (SBI) are taken */
const grp = rows => `<div class="group">${rows}</div>`;
const brow = (name, sub) => `<button class="row two"><span class="row-lead p25-lead">${chip(QC.bankColour(name))}</span><span class="row-main"><span class="row-title">${name}</span><span class="row-sub">${sub}</span></span></button>`;
const banksList = QC.nestedBar("Banks", QC.ibtn("add","Add bank")) + `<div class="content pad-top">${grp(BANKS.map(([b,s]) => brow(b,s)).join(""))}</div>`;
const editor = (o={}) => QC.nestedBar(o.title||"New bank") +
  `<div class="content pad-top p25-ed"><div class="stack">${preview({bank:o.name||NEW_BANK, hue:o.hue||autoHue})}
    ${QC.tf("Name", o.name||NEW_BANK, {data:'data-p25-name'})}
    ${colourField(o.hue||autoHue, {help: o.help ?? "Not used by another bank"})}</div></div>` + QC.sheetActions({primary:"Save", tone:"filled", screen:1});

QC.addScreens("#shots-colour", [
  ["colour", "Colour · bank default", F.form(F.data.filled), QC.p25.picker({on:"rust", bankHue:"rust", pv:icici})],
  ["colour-own", "Own colour", F.form({...F.data.filled, hue:"plum", pv:{...F.data.filled.pv, hue:"plum"}}), QC.p25.picker({on:"plum", bankHue:"rust", pv:icici})],
  ["colour-custom", "Custom colour", F.form(F.data.filled), QC.p25.customSheet({hue:248, t:.4, pv:icici})],
  ["colour-light", "Too light", F.form(F.data.filled), QC.p25.customSheet({hue:248, t:.86, pv:icici})],
  ["manage-banks", "Banks", banksList],
  ["manage-bank", "New bank · auto colour", editor(), "", 'data-p25-live="bank"'],

/* ======================================================================

const byBand = {}; for (const b in QC.BANK_COLOURS) (byBand[QC.BANK_COLOURS[b]] ||= []).push(b);
const box = (t, body, cls="") => `<div class="cmp ${cls}"><div class="cmp-h">${t}</div>${body}</div>`;
const mapRows = QC.PALETTE_ORDER.map((k,i) => `<tr><td class="mono">${i+1}</td><td>${chip(k)}</td><td>${H[k].name}</td><td class="mono">${H[k].c2}</td><td class="mono"><span class="ok">${onWhite(H[k].c2).toFixed(2)}</span></td><td>${(byBand[k]||[]).join(", ")}</td></tr>`).join("");
const allUsed = Object.values(QC.BANK_COLOURS);
const seeded = QC.autoBankColour(allUsed);
document.getElementById("p25-fnd").innerHTML = [
  box("Bank colours", `<div class="tbl-wrap"><table class="tbl"><tr><th>Order</th><th></th><th>Band</th><th>Light stop</th><th>White</th><th>Built-in banks</th></tr>${mapRows}

    <div class="cmp-spec">QC.BANK_COLOURS · Compose: BankColours.forName(name): Band? (BankCatalog.key match, aliases included) · echoes the brand hue, never its exact colour · every band ≥ 7:1 white on the light stop</div>`, "wide"),
  box("New bank colour", `<div class="p25-order">${QC.PALETTE_ORDER.map((k,i) => `<span>${chip(k)}${i+1}</span>`).join("")}</div>

    <div class="p25-ex"><span>Demo vault:</span>${usedNow.map((k,i) => `<span>${chip(k)}${BANKS[i][0]}</span>`).join("")} <span>→</span><b>${chip(autoHue)}${H[autoHue].name}</b></div>
    <div class="p25-ex"><span>All 26 built-in banks →</span><b>${chip(seeded)}${H[seeded].name}</b><span>least used</span></div>
    <div class="cmp-spec">QC.autoBankColour(used) · Compose: Band.autoFor(existing: List&lt;Band&gt;) · stored on the bank row; editing the bank can change it</div>`),
  box("Card colour", `<ol class="p25-steps"><li>Picking a bank sets the card’s colour to the bank colour.</li><li>Choosing a colour by hand pins it to this card; a later bank change keeps it.</li><li>Bank colour chip in the sheet returns the card to its bank colour.</li></ol>
    <div class="cmp-spec">card.band = manual ?: bankColour(bank) ?: graphite · swatch 64×40 r-sm, ring 2 gap + 2 ink, check · name f1 ink-2 · bank glyph 16 white · Custom: 7:1 guard on the light stop, Use colour disabled below it</div>`),
  box("Placeholders", `<div class="tbl-wrap"><table class="tbl"><tr><th>Field</th><th>Placeholder</th></tr>${[["Holder","Choose holder"],["Card number",'<span class="num">0000 0000 0000 0000</span>'],["Expiry",'<span class="num">MM/YY</span>'],["CVV",'<span class="num">123</span>'],["Bank","Choose bank"],["Type","Credit or debit"],["Colour","Bank colour"],["Due day","1 to 31"]].map(([a,b]) => `<tr><td>${a}</td><td style="color:var(--ink-ph)">${b}</td></tr>`).join("")}</table></div>
    <div class="cmp-spec">placeholder = --ink-ph (4.72:1 light, 5.02:1 dark; ink-3 is the disabled tone) · no format help line under fields; rules show only as errors</div>`)
].join("");

/* ======================================================================
   LIVE: any phone marked data-p25-live ("card" = Add card, "bank" = bank editor)
   ====================================================================== */
const $ = (s, r) => r.querySelector(s);
const paint = (art, h) => { if (!art) return; const b = band(h);
  art.style.setProperty("--c1", b.c1); art.style.setProperty("--c2", b.c2); art.style.setProperty("--glow", b.glow);

  const pat = art.querySelector(":scope > .art-pat"); const small = art.offsetWidth < 120;

  return {hue: d.p25Custom ? JSON.parse(d.p25Custom) : (d.p25Hue || null), bank: d.p25Bank || "", manual: d.p25Manual === "1"}; };

  const help = $(".app .p25-cf .tf-help", ph); if (help && ph.dataset.p25Live === "bank") help.textContent = b.key && !usedNow.includes(b.key) ? "Not used by another bank" : "Also used by another bank"; };
/* bank picked in Add card: follow the bank unless the colour was chosen by hand */
QC.p25.bankPicked = (ph, name) => { ph.dataset.p25Bank = name; if (!state(ph).manual) QC.p25.apply(ph, QC.bankColour(name)); };
const close = ph => ph.querySelectorAll("[data-p25-ov]").forEach(n => n.remove());
const open = (ph, html) => { close(ph); ph.insertAdjacentHTML("beforeend", html); QC.hydrate(ph); };
const pvProps = ph => { const bankEl = $(".app [data-pv-bank], .app [data-p25-pv-bank]", ph), last = $(".app [data-pv-last]", ph);
  return {bank: bankEl ? bankEl.textContent : "", last: last ? last.textContent : "", net: ($(".app [data-pv-net] .net", ph)||{dataset:{}}).dataset.net}; };
const openPicker = ph => { const s = state(ph), bankHue = ph.dataset.p25Live === "card" && s.bank ? QC.bankColour(s.bank) : null;
  open(ph, sheet("Colour", pickerBody({on: s.hue && typeof s.hue === "object" ? "custom" : (s.hue || bankHue || "graphite"), custom: typeof s.hue === "object" ? s.hue : null, bankHue, pv: pvProps(ph)}), true)); };
const body = ph => $("[data-p25-body]", ph);
const renderCustom = (ph, hue, t) => { const b = body(ph); if (!b) return; b.innerHTML = customBody({hue, t, pv: pvProps(ph)}); QC.hydrate(b); };
document.addEventListener("click", e => {
  const ph = e.target.closest(".phone"); if (!ph || !ph.dataset.p25Live) return;
  if (e.target.closest(".app .p25-cf .tf-box")) return openPicker(ph);
  if (e.target.closest("[data-p25-close],[data-p25-done]")) return close(ph);
  const sw = e.target.closest("[data-p25-ov] [data-p25-hue]");
  if (sw) { const k = sw.dataset.p25Hue, b = body(ph), s = state(ph), bankHue = ph.dataset.p25Live === "card" && s.bank ? QC.bankColour(s.bank) : null;
    QC.p25.apply(ph, k, ph.dataset.p25Live === "card" ? k !== bankHue : true);
    b.querySelectorAll(".p25-sw").forEach(x => { const on = x === sw; x.classList.toggle("is-on", on); x.setAttribute("aria-checked", on); });
    const chipBtn = $("[data-p25-bankchip]", b); if (chipBtn) { chipBtn.classList.toggle("is-on", k === bankHue); chipBtn.setAttribute("aria-pressed", k === bankHue); }
    paint($("[data-p25-pv]", b), k); return; }
  if (e.target.closest("[data-p25-bankchip]")) { const s = state(ph); const k = QC.bankColour(s.bank); if (!k) return;
    QC.p25.apply(ph, k, false); $(`[data-p25-ov] [data-p25-hue="${k}"]`, ph).click(); return; }
  if (e.target.closest("[data-p25-custom]")) return renderCustom(ph, 248, .4);
  if (e.target.closest("[data-p25-back]")) { const s = state(ph), b = body(ph), bankHue = ph.dataset.p25Live === "card" && s.bank ? QC.bankColour(s.bank) : null;
    b.innerHTML = pickerBody({on: s.hue && typeof s.hue === "object" ? "custom" : (s.hue || bankHue || "graphite"), custom: typeof s.hue === "object" ? s.hue : null, bankHue, pv: pvProps(ph)}); QC.hydrate(b); return; }
  const rec = e.target.closest("[data-p25-recent]"); if (rec) { const [h,t] = rec.dataset.p25Recent.split(",").map(Number); return renderCustom(ph, h, t); }
  if (e.target.closest("[data-p25-use]:not(:disabled)")) { const cv = $("[data-p25-cv]", ph); QC.p25.apply(ph, custom(+cv.dataset.hueV, +cv.dataset.t), true); return close(ph); }
});
/* strips: drag or arrow keys */
const setStrip = (ph, which, v) => { const cv = $("[data-p25-cv]", ph); if (!cv) { drag = null; return; } let hue = +cv.dataset.hueV, t = +cv.dataset.t;
  if (which === "hue") hue = Math.max(0, Math.min(360, v * 360)); else t = Math.max(0, Math.min(1, v));
  renderCustom(ph, hue, t); const again = $(`[data-p25-strip="${which}"]`, ph); if (again) again.focus({preventScroll:true}); };
let drag = null;
document.addEventListener("pointerdown", e => { const st = e.target.closest("[data-p25-ov] [data-p25-strip]"); if (!st) return; const ph = st.closest(".phone");
  drag = {ph, which: st.dataset.p25Strip}; const r = st.getBoundingClientRect(); setStrip(ph, drag.which, (e.clientX - r.left) / r.width); e.preventDefault(); });
document.addEventListener("pointermove", e => { if (!drag) return; const st = $(`[data-p25-strip="${drag.which}"]`, drag.ph); if (!st) return; const r = st.getBoundingClientRect(); setStrip(drag.ph, drag.which, (e.clientX - r.left) / r.width); });
document.addEventListener("pointerup", () => drag = null);
document.addEventListener("pointercancel", () => drag = null);
document.addEventListener("keydown", e => { const st = e.target.closest && e.target.closest("[data-p25-ov] [data-p25-strip]"); if (!st || !/Arrow(Left|Right)/.test(e.key)) return;
  const ph = st.closest(".phone"), cv = $("[data-p25-cv]", ph), d = e.key === "ArrowRight" ? .02 : -.02;
  setStrip(ph, st.dataset.p25Strip, st.dataset.p25Strip === "hue" ? +cv.dataset.hueV / 360 + d : +cv.dataset.t + d); e.preventDefault(); });

document.addEventListener("input", e => { const n = e.target.closest("[data-p25-name]"); if (!n) return; const ph = n.closest(".phone"); const t = $(".app [data-p25-pv-bank]", ph); if (t) t.textContent = n.value || "New bank"; });

document.querySelectorAll('[data-p25-live="bank"]').forEach(ph => { ph.dataset.p25Hue = autoHue; ph.dataset.p25Manual = ""; });
})();
</script>

/* ---------------- Settings ---------------- */
/* Autofill: the switch is its own control; the subtitle is the tappable fix */
/* AUDIT4 P3-6: until Android has chosen QuickCards the row shows "Not set up" (warn) and one action, "Finish setup", which opens Android settings.
   No switch in that state (it could not be on). Once chosen, the row is a normal switch row. */
const autofill = `<div class="row two">${`<span class="row-lead">${ic("password")}</span>`}<span class="row-main"><span class="row-title">Autofill</span><span class="row-sub warn">Not set up</span></span>

    swRow("sell","Tags on cards",false) +
    swRow("contactless","Add cards by tapping",true) +       /* NFC phones only */

  copying() + security;

const reminders = label("Reminders") + group(

/* Play update states on the Version row (Play installs only; the GitHub APK never shows them). ver = "" | "avail" | "down" | "ready" */
const VER = {"":["2.6.1","","div"], avail:["2.6.1 · Update available","p40-update","button"], down:["2.6.1 · Downloading update","","div"], ready:["2.6.1 · Restart to update","p40-update","button"]};
const sEndV = (ver="") => reminders +
  label("Backup") + group(
    row(ic("upload"),"Export backup") +
    row(ic("download"),"Import cards","Backup or spreadsheet")) +

    row(ic(ver?"system_update":"info"),"Version",VER[ver][0],"",VER[ver][1],VER[ver][2]) +
    row(ic("shield"),"Privacy policy","",chev)) +
  `<div class="p40-gap"></div>` + group(row(ic("delete"),"Erase all data","","","danger"));
const sEnd = sEndV();
/* Round 3 (c): the one help affordance, an ⓘ in the Settings bar, opens a short sheet on the 3 hardest concepts. No other help text. */

const settings = body => settingsBar + `<div class="content">${body}</div>` + QC.navbar("settings");
const helpRow = (icon, title, sub, label, goto, hl) => `<button class="row two p40-wrap${hl?" p40-hl":""}" data-goto="${goto}"${hl?' aria-current="true"':""} aria-label="${title}. ${sub} ${label}"><span class="row-lead">${ic(icon)}</span><span class="row-main"><span class="row-title">${title}</span><span class="row-sub">${sub}</span></span><span class="row-trail">${chev}</span></button>`;
/* each row deep-links: App lock (Instant copy), Settings at Autofill, Spreadsheet step 1. hl = the row a link landed on (from step 1) */
const help = (hl) => scrim + `<div class="sheet" role="dialog" aria-labelledby="p40-help"><div class="sheet-handle"></div>

  ${helpRow("touch_app","Instant copy","After you unlock, copy without your fingerprint for a while.","Opens App lock","settings-lock")}

  ${helpRow("table_chart","Spreadsheet columns","Keep the column names. Pick Network, Bank and Type from the lists.","Opens Spreadsheet","sheet-get",hl)}

const helpSheet = help();
QC.p40 = {helpSheet};
const settingsEnd = settings(sEnd);
const appLock = QC.nestedBar("App lock") + `<div class="content pad-top"><div class="p40-col">` +

const cbList = items => `<div class="cb-list">${items.map(([t, on]) => QC.toggleRow(t, on, {kind:"checkbox", ctlLead:true})).join("")}</div>`;
const editor = QC.nestedBar("Edit network") +

  cbList([["Check last digit", true], ["CVV optional", false]]) +

  `<div class="tf"><span class="tf-label" id="p40-cvvv">CVV digits</span><div class="seg" role="radiogroup" aria-labelledby="p40-cvvv"><button class="is-on" role="radio" aria-checked="true">${ic("check")}3</button><button role="radio" aria-checked="false">${ic("check")}4</button></div></div>` +

/* ---------------- Backup, import, spreadsheet, erase ---------------- */
const pw = (lbl, val, o={}) => tf(lbl, val, Object.assign({pw:1, trail:QC.ibtn("visibility","Show password")}, o));
/* P2-5: two rule lines, ink-2 until met, then ok + check; Export is disabled until both are met (live in backup-export) */
const rule = (t, met, metText) => `<span class="p40-rule${met?" is-met":""}" data-p40-rule${metText?` data-unmet="${t}" data-met="${metText}"`:""}><span class="p40-dot" aria-hidden="true"></span>${ic("check")}<span data-t>${met&&metText?metText:t}</span></span>`;
const exportDlg = (p1, p2) => { const len = p1.length >= 8, match = len && p1 === p2;
  return QC.dialog({title:"Export backup", body:`${QC.cards(QC.STORED.length)} and your lists, encrypted with this password. It can’t be recovered.`,
  content:`<div class="p40-fields" data-p40-export>${pw("Password",p1,{help:rule("At least 8 characters",len), data:'data-p40-pw="1"'})}${pw("Confirm password",p2,{focus:!match, help:rule("Must match",match,"Passwords match"), data:'data-p40-pw="2"'})}</div>
  ${QC.toggleRow("Include settings", true, {kind:"checkbox", ctlLead:true, cls:"p40-check"})}`,
  actions:`<button class="btn btn-text neutral">Cancel</button><button class="btn btn-text${match?"":" is-disabled"}" data-p40-go${match?"":' disabled aria-disabled="true"'}>Export</button>`}); };
const importSheet = scrim + `<div class="sheet" role="dialog" aria-label="Import"><div class="sheet-handle"></div>
  <div class="sheet-head"><div class="sheet-title">Import</div></div>
  ${row(`<span class="p40-src qc">${QC.MARK}</span>`,"QuickCards backup","",chev)}
  ${row(`<span class="p40-src xls">${ic("table_chart")}</span>`,"Spreadsheet",".xlsx or .csv",chev)}</div>`;

  <div class="p40-fields">${pw("Password","hunter22",{err:"Wrong password", focus:1})}</div>`,

/* values are row subtitles so they wrap at large text instead of squeezing the title */
const review = QC.nestedBar("Review") + `<div class="content pad-top"><div class="p40-col">` +

  group(

    row(ic("account_balance"),"Banks","1 new","","","div") +

  label("Existing cards") +

const fan = ids => `<div class="p40-fan" aria-hidden="true">${ids.map(id => QC.art(id,"mini",QC.net(QC.CARDS[id].net))).join("")}</div>`;

  group(

/* live: ticking the guard enables Erase (it still asks for the fingerprint: fail-closed) */
document.addEventListener("click", e => { const r = e.target.closest("[data-p40-ack]"); if (!r) return; const on = r.getAttribute("aria-checked") !== "true";
  r.setAttribute("aria-checked", String(on)); r.querySelector(".cb").classList.toggle("is-on", on);
  const go = r.closest(".dialog").querySelector("[data-p40-erase]"); go.disabled = !on; go.classList.toggle("is-disabled", !on); go.setAttribute("aria-disabled", String(!on)); });

/* live Export: rules and the Export button follow the two fields */
document.addEventListener("input", e => { const i = e.target.closest("[data-p40-pw]"); if (!i) return; const box = i.closest("[data-p40-export]"), dlg = box.closest(".dialog");
  const [a, b] = [...box.querySelectorAll("[data-p40-pw]")].map(x => x.value), len = a.length >= 8, match = len && a === b, r = box.querySelectorAll("[data-p40-rule]");
  r[0].classList.toggle("is-met", len); r[1].classList.toggle("is-met", match); r[1].querySelector("[data-t]").textContent = match ? r[1].dataset.met : r[1].dataset.unmet;
  const go = dlg.querySelector("[data-p40-go]"); go.disabled = !match; go.classList.toggle("is-disabled", !match); go.setAttribute("aria-disabled", String(!match)); });

document.addEventListener("click", e => { const g = e.target.closest("[data-goto]"); if (!g) return; const t = document.getElementById(g.dataset.goto); if (t) t.scrollIntoView({block:"center"}); });

  ["erase-ready", "Erase · ticked", settingsEnd, erase(true)],
  /* Round 3: every error names its fix */
  ["import-badfile", "Not a backup", settingsEnd, QC.dialog({alert:1, title:"Not a QuickCards backup",
    actions:`<button class="btn btn-text neutral">Cancel</button><button class="btn btn-text">Choose another file</button>`})],
  /* P2-7: the fix is one tap: the app bundles the blank sheet (offline) */
  ["sheet-badfile", "Missing columns", sheet1, QC.dialog({alert:1, cls:"p40-stack", title:"Missing columns: Bank", body:"Use a fresh sheet.",
    actions:`<button class="btn btn-text">Save blank sheet</button><button class="btn btn-text">Choose another file</button><button class="btn btn-text neutral">Cancel</button>`})]
]);
})();
</script>

<script>
(function(){
/* shot mode keeps only the phone, so move this part's CSS into <head> */
document.head.appendChild(document.getElementById("p60-css"));
const ic = QC.ic, C = QC.CARDS;
const list = items => `<div class="list">${items.join("")}</div>`;
const home = (body, o={}) => QC.homeBar(o) + QC.holderChips() + `<div class="content">${body}</div>` + QC.navbar("cards");

/* Round 6: every list here is derived from the one dataset; "Expired" on sbiOld comes from its date, not from the frame */
const tileList = (ids, o={}) => list(ids.map(id => QC.tile(id, (typeof o === "function" ? o(id) : o))));

/* ---------- Archived ---------- */
const archBar = QC.nestedBar("Archived", QC.ibtn("search","Search"));
/* AUDIT4 P2-1: Archived holds only archived cards (sbiOld expired, axisOld closed with a reason); never an active Home card, never "Last used" */
const archived = (ids=QC.ARCHIVED) => tileList(ids, {inArchive:true});
const archSearch = QC.homeBar({search:true, q:"closed"}).replace('placeholder="Search cards" aria-label="Search cards"', 'placeholder="Search" aria-label="Search archived cards"');
QC.addScreens("#shots-archive", [
  ["archive-list", "Archived", archBar + `<div class="content">${archived()}</div>`],
  ["archive-search", "Search · reason", archSearch + `<div class="content">${archived(QC.ARCHIVED.filter(id => (QC.CARDS[id].reason||"").toLowerCase().includes("closed")))}</div>`],
  ["archive-actions", "Restore, edit, delete", archBar + `<div class="content">${archived()}</div>`, QC.actionsSheet("axisOld", {archived:true})],
  ["archive-restored", "Card restored", archBar + `<div class="content">${archived(QC.ARCHIVED.filter(id => id !== "axisOld"))}</div>`, QC.toast("Card restored","Undo")],
  ["archive-empty", "None archived", QC.nestedBar("Archived") + `<div class="content"><div class="empty"><div class="empty-ic">${ic("inventory_2")}</div><div class="empty-title">No archived cards</div><div class="empty-body">Hold a card to archive it</div></div></div>`]
]);

/* ---------- Notifications ---------- */
const badge = `<span class="notif-badge">${QC.MARK}</span>`;
/* P: Android template: small app icon + app · time, title, text, then action buttons. No card thumbnail.
   M2 (owner): the copy notification shows expiry and CVV masked; the values leave only through Copy expiry / Copy CVV.
   It is VISIBILITY_SECRET, so the lock screen shows nothing of it. */
const notif = (when, title, text, actions="") => `<div class="notif"><div class="notif-app">${badge}QuickCards · ${when}</div>
  <div class="notif-body"><div class="notif-title">${title}</div><div class="notif-text">${text}</div></div>${actions?`<div class="notif-actions">${actions}</div>`:""}</div>`;
/* Round 6: the reminders are derived: bills inside their window ("Due 22 Nov"), and each expiry reminder with its fire date (it fires once,
   PREFS.expiryRemind days before the end of the expiry month, so SBI ••5530 (11/26) fired on 31 Oct saying "Expires in 30 days") */
const today = `Fri, ${QC.fmtDay(QC.todayN)}`, H = C.hdfc, REM = QC.expiryReminders();
const dueNotes = QC.ORDER.map(id => C[id]).filter(c => QC.dueText(c)).map(c => notif("9:00",`${c.bank} ${QC.masked(c.last)}`,`Due ${QC.fmtDay(QC.dueN(c))}`,`<button class="btn btn-tonal">Paid</button>`)).join("");
const shade = `<div class="shade p60-shade" role="region" aria-label="Notification shade"><div class="p60-date"><span>${today}</span></div>
  ${notif("now",`${H.bank} ${QC.masked(H.last)}`,`Expiry ••/•• · CVV •••`,`<button class="btn btn-tonal">Copy expiry</button><button class="btn btn-tonal">Copy CVV</button>`)}
  ${dueNotes}${REM.map(r => notif(r.when,`${r.c.bank} ${QC.masked(r.c.last)}`,r.text)).join("")}</div>`;
const lockscr = `<div class="shade p60-shade" role="region" aria-label="Lock screen"><div class="p60-clock"><b>9:41</b><span>${today}</span></div>
  ${notif("9:00","QuickCards","Card reminder")}</div>`;
const dueList = tileList(QC.ORDER);   /* the bill strip and "Expires soon" come from the dates; the order never changes */
QC.addScreens("#shots-notif", [
  ["notif-shade", "In the shade", "", shade],
  ["notif-lock", "On lock screen", "", lockscr],
  ["notif-due", "Bill due · expires soon", home(dueList)],
  /* AUDIT5 P2-2: the expiry reminder opens its card (SBI ••5530, still active); archived cards never appear on Home */
  ["notif-expired", "Expiry reminder · opens card", QC.detailsScreen(REM[0].c.id)]
]);

/* ---------- Autofill (inside another app) ---------- */
const APP = "Kettle &amp; Co";
/* another app's checkout form (not QuickCards UI), drawn with the shared field */
const checkout = QC.nestedBar("Checkout") + `<div class="content pad-top" style="display:flex;flex-direction:column;padding-bottom:var(--s8)"><div class="stack">
  ${QC.tf("Card number","",{ph:"1234 5678 9012 3456",focus:1})}<div class="tf-row">${QC.tf("Expiry","",{ph:"MM/YY"})}${QC.tf("CVV","",{ph:"123"})}</div>${QC.tf("Name on card","",{ph:"Name"})}</div>
  <button class="btn btn-tonal lg block p60-pay">Pay ₹1,240</button></div>`;
const afRow = (id, pressed) => { const c=C[id]; return `<button class="af-row${pressed?" is-pressed":""}" role="option" aria-selected="false">${QC.net(c.net,"slot")}<span class="row-main"><span class="af-title">${c.bank} ${QC.masked(c.last)}</span><span class="af-sub">${c.holder}</span></span></button>`; };
/* P2-1 (PRODUCT): "Search all N cards…" first and actionable (it asks to unlock, then opens the full list), then up to five cards:
   pinned, then most recently copied, then list order. Every row is an option (Compose: one Dataset each; the search row's Dataset carries an authentication IntentSender) */
const afSearch = `<button class="af-row af-search" role="option" aria-selected="false" aria-label="Search all ${QC.cards(QC.ORDER.length)}, asks to unlock"><span class="af-lead">${ic("search")}</span><span class="row-main"><span class="af-title">Search all ${QC.cards(QC.ORDER.length)}…</span></span></button>`;
const dropdown = `<div class="af p60-af" role="listbox" aria-label="QuickCards">${afSearch}${QC.autofillIds().map((id, i) => afRow(id, i === 0)).join("")}</div>`;
const prompt = (sub, cls="", why="") => `<div class="scrim"></div><div class="sheet sys-prompt ${cls}" role="dialog" aria-label="Unlock QuickCards"><div class="sheet-handle"></div>
  <div class="empty" style="padding-top:var(--s4)"><div class="sheet-title">Unlock QuickCards</div>${sub?`<div class="empty-body">${sub}</div>`:""}<div class="empty-ic" style="margin-top:var(--s6)">${ic("fingerprint")}</div>${why?`<div class="empty-body p60-why">${why}</div>`:""}</div>
  <div class="actions" style="justify-content:flex-start;padding:var(--s6) var(--s4) 0"><button class="btn btn-text">Use PIN</button></div></div>`;
const pickRow = id => { const c=C[id]; return `<button class="row two">${QC.mini(id)}<span class="row-main"><span class="row-title">${c.bank} ${QC.masked(c.last)}</span><span class="row-sub">${c.type} · ${c.holder}</span></span></button>`; };
const forLabel = `<div class="group-label p60-label">For ${APP}</div>`;
QC.addScreens("#shots-autofill", [
  ["autofill-dropdown", "Checkout dropdown", checkout, dropdown],
  ["autofill-prompt", "Fill prompt", checkout, prompt(`Fill card in ${APP}`)],
  ["autofill-list", "Choose card", QC.nestedBar("Choose card", QC.ibtn("search","Search")) + `<div class="content">${forLabel}<div class="group">${QC.ORDER.map(pickRow).join("")}</div></div>`],
  ["autofill-noresult", "No matches", QC.homeBar({search:true,q:"amex"}) + `<div class="content">${forLabel}<div class="empty compact"><div class="empty-ic">${ic("search")}</div><div class="empty-title">No matches</div><div class="empty-body">Try a bank, holder, tag or digits</div><div class="actions"><button class="btn btn-text" data-act="search-clear">Clear search</button></div></div></div>`]
]);

/* ---------- Launcher shortcuts (Round 3 b) ----------
   Long-press the app icon: Add card, Search, and Tap to add (NFC phones only). Add card + Search are static (shortcuts.xml), Tap to add is a dynamic shortcut pushed only on NFC phones;
   each opens QuickCards through the lock first (fail-closed), then the screen. Shown on an NFC phone. */
const sc = (icon, label) => `<button class="p60-sc"><span>${ic(icon)}</span>${label}</button>`;
const blank = n => Array.from({length:n}, () => `<span class="p60-app" aria-hidden="true"><span class="p60-ico"></span></span>`).join("");
const launcher = `<div class="p60-wall" style="${QC.vars("indigo")}" role="region" aria-label="Home screen">
  <div class="p60-grid">${blank(4)}<span class="p60-app"><span class="p60-ico qc p60-held">${QC.MARK}</span>QuickCards</span>${blank(3)}</div>
  <div class="p60-pop" role="menu" aria-label="QuickCards shortcuts">${sc("add","Add card")}${sc("search","Search")}${sc("contactless","Tap to add")}</div></div>`;

/* ---------- Toasts ---------- */
const cardsHome = home(tileList(QC.ORDER));
QC.addScreens("#shots-shortcuts", [["launcher-shortcuts", "App shortcuts", "", launcher]]);
QC.p60 = {sc};
QC.addScreens("#shots-toasts", [
  ["toast-copied", "Details copied", cardsHome, QC.toast("Details copied","Clear",null,{nav:true})],
  ["toast-paid", "Paid · Undo", home(tileList(QC.ORDER, id => ({paid: id === "hdfc"}))), QC.toast("Paid","Undo",null,{nav:true})],
  ["toast-archived", "ICICI archived · Undo", home(tileList(QC.ORDER.filter(id => id !== "icici"))), QC.toast("Card archived","Undo",null,{nav:true})],
  ["toast-error", "Error", QC.addForm("filled"), QC.toast("Couldn’t save card","Try again",null,{error:true,nav:true})   /* 8 above the Save bar */]
]);

/* ---------- Errors and recovery ---------- */
const lock = QC.lockScreen();
/* Round 8 (owner 4): the one banner component, one line; only the icon carries the error tint, the text is ink */
const nolock = `<div class="banner is-error" role="alert">${ic("phonelink_lock")}<div class="banner-main"><div class="banner-title">Set a screen lock to copy</div></div><div class="actions"><button class="btn btn-text" aria-label="Open screen lock settings">Settings</button></div></div>`;
/* M/S: NFC off blocks the tap flow and needs a decision, so it is a dialog (shared builder) */
const nfcDialog = QC.dialog({alert:1, id:"p60-nfc", title:"NFC is off",
  actions:`<button class="btn btn-text neutral">Cancel</button><button class="btn btn-text" aria-label="Turn on NFC in Android settings">Turn on</button>`});
/* O: no icon */
const keyDialog = QC.dialog({alert:1, id:"p60-key", title:"Cards unavailable", body:"The encryption key on this phone is unavailable. Your data is still stored.",
  actions:`<button class="btn btn-text neutral">Close</button><button class="btn btn-text">Try again</button>`});
QC.addScreens("#shots-errors", [
  ["err-nfc", "NFC off", QC.addForm("empty"), nfcDialog],
  ["err-key", "Key unavailable", QC.homeBar({noSearch:true}) + `<div class="content"></div>` + QC.navbar("cards"), keyDialog],
  ["err-nolock", "No screen lock", home(`<div class="stack" style="padding-top:var(--s2)">${nolock}${tileList(QC.ORDER, {copyDisabled:true})}</div>`)],
  ["err-unlock", "Unlock failed", lock, prompt("", "p60-fail", "Not recognized")]
]);
})();
</script>
<!-- 70-adaptive: M3 window size classes. Phone landscape (medium width, compact height), foldable / small tablet
     portrait (medium), tablet landscape (expanded), foldable book posture (hinge split). Reuses the shared builders;
     only layout lives here. Frames: figure + .phone carry .p70-land|.p70-med|.p70-exp|.p70-fold (window size in dp). -->
<style id="p70-css">
/* layout tokens (dp). Window frames; panes; max widths. Compose: Dimens.kt (RailWidth, ListPaneWidth, DialogMaxWidth, PageMaxWidth) */
.p70-dev,.p70-fnd{--p70-rail:80px;--p70-list:360px;--p70-list-m:328px;--p70-dlg:560px;--p70-page:600px;--p70-detail:840px}
.p70-land{--phone-w:780px;--phone-h:360px}
.p70-med{--phone-w:700px;--phone-h:840px}
.p70-exp{--phone-w:1280px;--phone-h:800px}
.p70-fold{--phone-w:840px;--phone-h:720px}
.shot.p70-shot{width:auto}
.p70-shots{gap:var(--s12) var(--s8)}
/* panes: rail | panes, side by side, under the status bar */
.p70-row{flex:1;min-height:0;display:flex}
.p70-pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.p70-fill{flex:1}
.p70-half{flex:1;min-width:0}
.p70-list{flex:none;width:var(--p70-list);box-shadow:1px 0 0 var(--line)}
.p70-list.m{width:var(--p70-list-m)}
.p70-lp{flex:none;width:var(--p70-list)}
/* navigation rail: the bottom bar's items in a column (same icons, 56x32 indicator, labels), top-aligned */
.p70-rail{flex:none;width:var(--p70-rail);display:flex;flex-direction:column;gap:var(--s1);padding:var(--s2) 0;background:var(--bg);position:relative;z-index:2}
.p70-rail .nav-i{flex:none;min-height:var(--s16)}
/* compact height: holder chips move into the top bar (one 64 row instead of 64 + 48) */
.p70-bar .appbar-title{flex:none}
.p70-bar .chips{flex:1;min-width:0;padding:0 0 0 var(--s6)}
/* tile grid (2 columns from 600 wide) */
.p70-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);align-items:start;padding:var(--s2) 0 var(--s8)}
/* AUDIT4 P3-7: staggered lanes (Compose: LazyVerticalStaggeredGrid, 2 fixed lanes): each tile goes to the shorter lane, so a tall tile leaves no hole */
.p70-grid.is-placed{grid-auto-rows:calc(var(--s1) / 4);row-gap:0}   /* measured placement: 1dp rows, each tile spans its own height */
/* tablet + keyboard: the window above the keyboard holds the panes and the dialog; the keyboard is the system's, below the scrim */
.p70-imeup{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.p70-imeup > .scrim{z-index:20}
.p70-fdlg.p70-fdlg-ime{top:var(--s6);bottom:var(--s6)}
.p70-tkb.p20-kb{padding:var(--s3) calc(50% - var(--p70-page) / 2) var(--s6)}
/* Round 5: compact height + keyboard: the form column (max 600) is bottom-anchored, Save rides on the keyboard, the focused row stays visible */
.p70-imecol{flex:1;min-height:0;width:100%;max-width:var(--p70-page);margin:0 auto;display:flex;flex-direction:column}
.p70-kb.p20-kb{grid-template-columns:repeat(6,1fr);gap:var(--s1) var(--s2);padding:var(--s1) var(--s2) var(--s6)}
.p70-imecol .content.p20-ime{padding-bottom:var(--s2)}   /* compact height: the 24 inset is paid for by tighter key rows and form end, so the focused row keeps its label */   /* AUDIT6 P3-5: keys end above the gesture area (navigationBars inset), as on the phone */
.p70-kb.p20-kb > span{height:var(--s8);font-size:var(--f3);line-height:var(--lh3)}
.p70-kb.p20-kb .ic{width:var(--ic);height:var(--ic)}
/* compact height: details rows 56 (48 hit kept) */
.p70-dense .drow{min-height:var(--row)}
.p70-top{padding-top:var(--s4)}
/* hero keeps the ISO ID-1 ratio at any pane width */
.p70-dev .hero{min-height:0;aspect-ratio:1.586}
/* medium list-detail: the detail pane is 292 (260 content). The hero scales as one object from its 328 design size (Compose: graphicsLayer scale = width / 328).
   AUDIT6 P3-4: detail rows keep the ONE inline layout (key | value | Copy) used on phone, fold and expanded; a long value wraps under the key as everywhere */
.p70-med .p70-fill .details-stack > .hero{width:var(--art-w);zoom:.7927}
/* a pane under 320 drops only the visible "Copied" word (the filled check disc + tinted value still show it; TalkBack still announces it), so the value keeps its line */

/* selection in a list pane: tile = swatch ring (2 gap + 2 ink); row = tonal-2 fill */
.art.tile.p70-sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink),0 16px 24px -12px var(--glow)}

/* pane title bar without Back (both panes visible): title on the 24 content edge */
.appbar.nested.p70-pbar{padding-left:var(--s6)}
.p70-page{max-width:var(--p70-page)}
.p70-gap{height:var(--s6)}

.p70-fdlg{position:absolute;z-index:21;left:50%;top:calc(var(--sb-h) + var(--s6));bottom:var(--s6);width:var(--p70-dlg);transform:translateX(-50%);

.p70-hinge{flex:none;width:var(--s6)}
.p70-crease{position:absolute;z-index:35;top:0;bottom:0;left:50%;width:var(--s6);transform:translateX(-50%);pointer-events:none;

<script>
document.head.appendChild(document.getElementById("p70-css")); /* survive ?shot= mode */
(function(){
const ic = QC.ic, C = QC.CARDS, chev = QC.ic("chevron_right","sm");
const SIZE = {land:[780,360], med:[700,840], exp:[1280,800], fold:[840,720]};
/* frame: like QC.screen, but the window class rides on the figure AND the phone (the phone is moved alone in ?shot= mode) */
const frame = (id, cap, cls, app, ov="") =>
  `<figure class="shot p70-shot p70-${cls}" id="${id}"><div class="phone p70-dev p70-${cls}" data-p70-w="${SIZE[cls][0]}"><div class="app">${app}</div>${ov}</div><figcaption>${cap} · ${SIZE[cls][0]}×${SIZE[cls][1]}</figcaption></figure>`;

/* ---------- shared pieces (wrapping 00-head builders) ---------- */
const rail = on => QC.navbar(on).replace('<nav class="navbar">', '<nav class="p70-rail" aria-label="Main">');
const sel = (html, on) => on ? html.replace('class="art tile', 'class="art tile p70-sel') : html;
const tiles = (ids, on, o={}) => ids.map(id => sel(QC.tile(id, o), id === on)).join("");
/* P3-3: the detail pane has no visible title, so it carries an invisible heading (Compose: paneTitle + heading()) */
const detailBar = (back, id) => back ? QC.nestedBar("", QC.ibtn("edit","Edit card") + QC.ibtn("more_vert","More"), QC.paneTitle(C[id]))
  : `<div class="appbar nested"><div class="appbar-title" role="none"><span class="sr" role="heading" aria-level="1">${QC.paneTitle(C[id])}</span></div>${QC.ibtn("edit","Edit card")}${QC.ibtn("more_vert","More")}</div>`;
/* P3-7 + AUDIT5 adaptivity: staggered 2-lane grid (Compose: LazyVerticalStaggeredGrid). The DOM keeps the list order (reading and focus
   order = the phone list); after layout each tile is placed in the shorter lane by its MEASURED height, so top edges rise in list order */
const stagger = ids => `<div class="p70-grid" data-stagger>${ids.map(id => QC.tile(id)).join("")}</div>`;
QC.LAYOUT = QC.LAYOUT || [];
QC.LAYOUT.push(root => root.querySelectorAll(".p70-grid[data-stagger]").forEach(g => {
  const ts = [...g.children]; g.classList.remove("is-placed"); ts.forEach(t => { t.style.gridColumn = ""; t.style.gridRow = ""; });
  const gap = parseFloat(getComputedStyle(g).rowGap) || 0, h = [0, 0];
  const hs = ts.map(t => Math.ceil(t.offsetHeight)); if (!hs.every(Boolean)) return;
  ts.forEach((t, k) => { const i = h[0] <= h[1] ? 0 : 1; t.style.gridColumn = String(i + 1); t.style.gridRow = `${h[i] + 1} / span ${hs[k]}`; h[i] += hs[k] + gap; });
  g.classList.add("is-placed"); }));
/* list pane under 360: rows with the mini card (tiles need 288+) */
const crow = (id, on) => { const c = C[id];
  return `<button class="row two${on?" p70-on":""}"${on?' aria-current="true"':""}><span class="row-lead">${QC.mini(id)}</span><span class="row-main"><span class="row-title">${c.bank} ${QC.masked(c.last)}</span><span class="row-sub">${c.type} · ${c.holder}</span></span></button>`; };
const cardsPane = (on, cls="p70-list", o={}) => `<div class="p70-pane ${cls}">${QC.homeBar()}${QC.holderChips()}<div class="content"><div class="list">${tiles(QC.ORDER, on, o)}</div></div></div>`;

/* ---------- compact height: phone landscape 780x360 (medium width) ---------- */
const landBar = `<div class="appbar p70-bar"><div class="appbar-title" role="heading" aria-level="1">Cards</div>${QC.holderChips()}<div class="appbar-actions">${QC.ibtn("search","Search")}${QC.ibtn("add","Add card")}</div></div>`;
const landHome = `<div class="p70-row">${rail("cards")}<div class="p70-pane p70-fill">${landBar}<div class="content">${stagger(QC.ORDER)}</div></div></div>`;
const landCard = `<div class="p70-row"><div class="p70-pane p70-lp">${detailBar(true,"hdfc")}<div class="content">${QC.hero("hdfc")}</div></div>
  <div class="p70-pane p70-fill"><div class="content p70-dense p70-top">${QC.details("hdfc",{copied:"number"})}</div></div></div>`;

/* ---------- medium: foldable open / small tablet portrait 700x840 ---------- */
const medHome = `<div class="p70-row">${rail("cards")}<div class="p70-pane p70-fill">${QC.homeBar()}${QC.holderChips()}<div class="content">${stagger(QC.ORDER)}</div></div></div>`;
/* Round 4 (P2-2): the same list pane as the foldable (328: holder chips, filter, tiles with Copy); detail fills the rest */
const medCard = `<div class="p70-row">${rail("cards")}${cardsPane("icici","p70-list m")}
  <div class="p70-pane p70-fill">${detailBar(false,"icici")}<div class="content"><div class="stack details-stack">${QC.hero("icici")}${QC.details("icici")}</div></div></div></div>`;

/* ---------- expanded: tablet landscape 1280x800 ---------- */
const expDetail = id => `<div class="p70-pane p70-fill">${detailBar(false,id)}<div class="content p70-pad"><div class="p70-split">${QC.hero(id)}${QC.details(id,{copied:"expiry"})}</div></div></div>`;
const expCards = `<div class="p70-row">${rail("cards")}${cardsPane("hdfc", "p70-list", {lastId:"hdfc"})}${expDetail("hdfc")}</div>`;
const addForm = QC.p20 ? QC.p20.form(QC.p20.data.filled).replace('aria-label="Back" data-act="back"', 'aria-label="Close" data-act="close-overlay"').replace("#i-arrow_back", "#i-close") : QC.addForm("filled");
const expAddOv = `<div class="scrim" data-act="close-overlay"></div><div class="p70-fdlg" role="dialog" aria-label="Add card">${addForm}</div>`;

/* Settings two-pane: groups left, the open group's page right (rows as in part 40) */
const row = (lead, title, sub="", trail="", cls="", tag="button", attrs="") =>
  `<${tag} class="row${sub?" two":""} ${cls}"${attrs}>${lead?`<span class="row-lead">${lead}</span>`:""}<span class="row-main"><span class="row-title">${title}</span>${sub?`<span class="row-sub">${sub}</span>`:""}</span>${trail?`<span class="row-trail">${trail}</span>`:""}</${tag}>`;
const G = [["credit_card","Cards"],["content_copy","Copying"],["lock","Security"],["notifications","Reminders"],["upload","Backup"],["info","About"]];
const groupsPane = `<div class="p70-pane p70-list"><div class="appbar"><div class="appbar-title" role="heading" aria-level="1">Settings</div></div><div class="content">
  <div class="group">${row(ic("contrast"),"Theme","System default",chev)}</div><div class="p70-gap"></div>
  <div class="group">${G.map(([i,t]) => row(ic(i), t, "", "", t==="Copying"?"p70-on":"", "button", t==="Copying"?' aria-current="true"':"")).join("")}</div><div class="p70-gap"></div>
  <div class="group">${row(ic("delete"),"Erase all data","","","danger")}</div></div></div>`;
/* same Autofill row as part 40 (P3-6): "Not set up" + its own Finish setup action, no switch until Android has chosen QuickCards */
const autofill = `<div class="row two"><span class="row-lead">${ic("password")}</span><span class="row-main"><span class="row-title">Autofill</span><span class="row-sub warn">Not set up</span></span>
  <button class="btn btn-text p40-act" aria-label="Finish setup in Android settings">Finish setup</button></div>`;
const copyPage = `<div class="p70-pane p70-fill"><div class="appbar nested p70-pbar"><div class="appbar-title" role="heading" aria-level="2">Copying</div></div><div class="content p70-pad"><div class="p70-page">
  <div class="group">${row(ic("content_paste_off"),"Clear clipboard","After 1 minute",chev)}${QC.toggleRow("Expiry and CVV notification", true, {lead:ic("notifications"), sub:"Hidden on lock screen"})}${row("<span style=\"min-width:var(--ic-lg)\"></span>","Notification time","30 seconds",chev)}${autofill}</div></div></div></div>`;
const expSettings = `<div class="p70-row">${rail("settings")}${groupsPane}${copyPage}</div>`;

/* ---------- compact height + IME (Round 5, AUDIT4 adaptivity gap): Add card in phone landscape with the number pad open ----------
   No rail (full-screen nested). The column caps at 600; the focused Expiry | CVV row sits just above Save, which rides on the keyboard; rows above scroll under the bar */
const lkb = `<div class="p20-kb p70-kb" aria-hidden="true">${["1","2","3","4","5"].map(k=>`<span>${k}</span>`).join("")}<span class="fn">${ic("backspace")}</span>${["6","7","8","9","0"].map(k=>`<span>${k}</span>`).join("")}<span class="fn">${ic("check")}</span></div>`;
const landForm = `<div class="content pad-top p20-ime"><div class="stack">${QC.tf("Card number","4024 0071 5338 7781",{num:1, net:"visa"})}<div class="tf-row">${QC.tf("Expiry","05/30",{num:1})}${QC.tf("CVV","91",{num:1, pw:1, focus:1, trail:QC.ibtn("visibility","Show CVV")})}</div></div></div>`;
const landAdd = QC.nestedBar("Add card").replace('class="appbar nested"','class="appbar nested p20-scrolled"') + `<div class="p70-imecol">${landForm}${QC.p20 ? QC.p20.foot("Save card", true, "Add the CVV") : ""}</div>` + lkb;

/* ---------- foldable book posture 840x720: hinge-aware split ---------- */
const foldApp = `<div class="p70-row"><div class="p70-row p70-half">${rail("cards")}${cardsPane("axis","p70-list m")}</div><div class="p70-hinge" aria-hidden="true"></div>
  <div class="p70-pane p70-fill">${detailBar(false,"axis")}<div class="content"><div class="stack details-stack">${QC.hero("axis")}${QC.details("axis")}</div></div></div></div>`;
const crease = `<div class="p70-crease" aria-hidden="true"></div>`;
const tkb = `<div class="p20-kb p70-tkb" aria-hidden="true">${["1","2","3","4","5","6","7","8","9"].map(k=>`<span>${k}</span>`).join("")}<span class="fn">${ic("backspace")}</span><span>0</span><span class="fn">${ic("check")}</span></div>`;
/* the same form as the phone, scrolled so the focused CVV row sits just above Save (Compose: imePadding + bringIntoViewRequester) */
const imeForm = QC.p20 ? QC.p20.form({...QC.p20.data.read, cvv:"91"}, {}, {end:1, invalid:1}).replace('aria-label="Back" data-act="back"', 'aria-label="Close" data-act="close-overlay"').replace("#i-arrow_back", "#i-close") : landAdd;
const imeDlg = `<div class="p70-fdlg p70-fdlg-ime" role="dialog" aria-label="Add card">${imeForm}</div>`;
const expIme = `<div class="p70-imeup">${expCards}<div class="scrim"></div>${imeDlg}</div>${tkb}`;

document.getElementById("shots-adaptive").insertAdjacentHTML("beforeend", [
  frame("adapt-land-home", "Landscape · Cards", "land", landHome),
  frame("adapt-land-card", "Landscape · Card", "land", landCard),
  frame("adapt-med-home", "Medium · Cards", "med", medHome),
  frame("adapt-med-card", "Medium · List-detail", "med", medCard),
  frame("adapt-fold", "Fold · Book posture", "fold", foldApp, crease),
  frame("adapt-exp-cards", "Expanded · List-detail", "exp", expCards),
  frame("adapt-exp-add", "Expanded · Add card", "exp", expCards, expAddOv),
  frame("adapt-exp-settings", "Expanded · Settings", "exp", expSettings),
  frame("adapt-land-add", "Landscape · Keyboard open", "land", landAdd),
  frame("adapt-exp-ime", "Expanded · Keyboard open", "exp", expIme)
].join(""));

/* gallery: large windows are drawn scaled to the column (CSS zoom keeps layout in dp); ?shot= renders 1:1 */
if (!new URLSearchParams(location.search).get("shot")) {
  const box = document.getElementById("shots-adaptive");
  const fit = () => { const avail = box.clientWidth; box.querySelectorAll(".p70-dev").forEach(p => { p.style.zoom = Math.min(1, avail / +p.dataset.p70W); }); };
  fit(); addEventListener("resize", fit);
}

/* ---------- Foundations: adaptive ---------- */
const box = (t, body, cls="") => `<div class="cmp ${cls}"><div class="cmp-h">${t}</div>${body}</div>`;
const tbl = (head, rows) => `<div class="tbl-wrap" data-allow-clip><table class="tbl"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const m = s => `<span class="mono">${s}</span>`;
const F = [];
F.push(box("Breakpoints · window width (dp)", `<div class="p70-bp"><div><b>Compact</b><span>&lt; 600 · phone portrait</span></div><div><b>Medium</b><span>600–839 · landscape, fold open</span></div><div><b>Expanded</b><span>≥ 840 · tablet, fold landscape</span></div></div>
  ${tbl(["Class","Navigation","Cards","Card details","Add / Edit","Settings"], [
    ["Compact","Bottom bar","1 column of tiles","Full screen, stacked","Full screen","1 pane, sub-pages push"],
    ["Medium","Rail","2-column tile grid","List-detail: list pane 328 | detail","Dialog 560","1 pane, max 600"],
    ["Expanded","Rail","List pane 360 of tiles","Detail pane: card | rows","Dialog 560","Two-pane: groups 360 | page"],
    ["Height &lt; 480","Rail (landscape)","Chips move into the top bar","Card left, rows right (56)","Full screen, column max 600; with the keyboard the focused row + Save sit on it","1 pane"]])}
  <div class="cmp-spec">drive layout from the window size class, never from the device model · width decides structure; compact height only tightens it</div>`, "wide"));
F.push(box("Rail vs bar", tbl(["Rule",""], [
    ["Bar","width &lt; 600 · 80 tall incl. gesture inset"],
    ["Rail","width ≥ 600 · 80 wide, items top, 64 each"],
    ["Same items","Cards · Manage · Settings, same icons, 56×32 indicator"],
    ["Stays","while the destination is a pane"],
    ["Hides","full-screen nested screens (landscape details)"],
    ["Tabletop","bar on the lower half"]]) +
  `<div class="cmp-spec">one navigation at a time · never bar + rail · + stays in the top bar of the list pane</div>`));
F.push(box("Max content widths", tbl(["Element","dp"], [
    [m("--p70-rail"),"80"],[m("--p70-list"),"360 list pane (tile 328)"],[m("--p70-list-m"),"328 list pane (medium, fold half): the same tiles, chips, filter and Copy"],
    ["Tile","288 min · 2 staggered lanes from 600 (each tile to the shorter lane)"],[m("--p70-page"),"600 settings / form page"],[m("--p70-dlg"),"560 Add, Edit dialog"],[m("--p70-detail"),"840 detail content"],["Hero","ISO 1.586 ratio at any width"]]) +
  `<div class="cmp-spec">panes sit on bg, divided by a 1dp line · pane edges 16 (list) and 24 (detail, page) · selected tile = 2 gap + 2 ink ring, selected row = tonal-2</div>`));
F.push(box("Foldables", tbl(["Posture","Layout"], [
    ["Flat","the width rules above"],
    ["Book (vertical hinge)","list | detail, each pane ends at the hinge bounds"],
    ["Tabletop (horizontal hinge)","card on the top half, rows and actions below"],
    ["Hinge","24 zone · no text, art, button or divider crosses it"]]) +
  `<div class="cmp-spec">read the hinge from the window, not the model · a separating hinge forces two panes even at medium width · system bars may cross it, app content never</div>`));
F.push(box("Compose mapping", tbl(["Design","Compose"], [
    ["Window size class",m("currentWindowAdaptiveInfo().windowSizeClass")+" · "+m("isWidthAtLeastBreakpoint(600 | 840)")],
    ["Bar ↔ rail",m("NavigationSuiteScaffold")+" · "+m("NavigationSuiteScaffoldDefaults.calculateFromAdaptiveInfo(info)")],
    ["List-detail, two-pane Settings",m("ListDetailPaneScaffold")+" + "+m("rememberListDetailPaneScaffoldNavigator()")+" · Back pops the detail pane"],
    ["Pane count, hinge",m("calculatePaneScaffoldDirective(info, HingePolicy.AvoidSeparating)")],
    ["2-lane tile grid",m("LazyVerticalStaggeredGrid(StaggeredGridCells.Fixed(2))")+" · tiles keep list order for TalkBack"],
    ["Keyboard",m("Modifier.imePadding()")+" on the Save bar · "+m("BringIntoViewRequester")+" for the focused field"],
    ["Posture",m("info.windowPosture")+" (isTabletop, hingeList) · WindowManager "+m("FoldingFeature")],
    ["Two panes, older pattern",m("TwoPane")+" (Accompanist, deprecated): use the scaffold"],
    ["Add / Edit dialog",m("QcDialog")+" (never raw Dialog) · width 560, "+m("usePlatformDefaultWidth = false")],
    ["Insets",m("WindowInsets.safeDrawing")+" incl. display cutout beside the rail"]]) +
  `<div class="cmp-spec">material3-adaptive, material3-adaptive-navigation-suite · minSdk 26 unchanged · rotation and fold keep state (rememberSaveable, the navigator's saved pane)</div>`, "wide"));
document.getElementById("p70-fnd").innerHTML = F.join("");
})();
</script>

  `<button class="btn ${v} ${s}"${s==="is-disabled"?' disabled aria-disabled="true"':""}>${s==="is-loading"?'<span class="spin"></span>':""}${icon?ic(icon):""}${label}</button>`)).join("");

  ".ibtn 48 hit · icon 24 ink · state disc 40 var(--state) · .tonal disc 36 + icon 18"));

  st("Bill due · day 22", QC.tile("hdfc"), "full") + st("Expires soon · bill due", QC.tile(W("axis",{exp:"11/26",dueDay:21})), "full") +
  st("Long bank name", QC.tile(W("icici",{bank:"Industrial and Commercial Bank of Asia", exp:"12/26"})).replace('<div class="art tile"','<div data-allow-clip class="art tile"'), "full") + st("Holder hidden", QC.tile("axis",{holder:false, note:false}), "full") +
  st("Note · fits in 2 lines", QC.tile("axis"), "full") + st("Note · longer: 2 lines + ellipsis", QC.tile(W("axis",{note:QC.CARDS.axis.note+" Lounge list and forex rates are on the bank site."})), "full") +
  st("Check (legacy repair)", QC.tile("sbi",{check:true}), "full") + st("Archived · in Archived (reason)", QC.tile("axisOld",{inArchive:true}), "full") +
  st("Archived · in main search", QC.tile("axisOld"), "full"),
  ".art.tile · pad s4 · r-lg 20 · bank f3/600 · meta f2 white 80% · status chip f1 h20 on meta line · number f4 mono, one line, pill on its centre · gap s6 · due strip 48, inset s2, gap s6 · list gap s3 · open = full-bleed sibling button, Copy and Mark paid are separate buttons above it (never nested) · Last used: the most recently copied card, in the status chip, only when no status or due bill applies; never reorders · long-press (500ms, LONG_PRESS haptic) = card actions sheet; pressed layer white 10% · no ⋮ on the tile (it crowds the mark): actions = long-press, the details ⋮ and TalkBack customActions; tip 1 teaches the hold · status, bill strip and Last used are derived from the card's dates (no status parameter) · Expired chip: white f1/600 on --on-art-chip, 1dp --on-art-danger ring; the stripes fade out above the digits so the date (--on-art-danger) is ≥7:1 on every pixel behind it · Round 8: note (Notes on cards on) f2 white 80% under the meta, at most 2 lines with an ellipsis and nothing else (no More/Less, never expanded); the full note is on Card details; a 500 ms hold copies it (“Note copied” snackbar), a tap opens the card · ONE status chip (Archived, Expired, Check, Expires soon, Last used, archive reason): text only, no icon, f1/600 white on --on-art-chip, 1dp white 30% ring, min 20, r-xs; one slot on the subtitle line, right-aligned, centred on that line, right edge = mark artwork = Copy pill (0 px); one chip by priority Archived > Expired > Check > Expires soon > Last used · Check reads “Check details” · archived: the reason chip in Archived, “Archived · reason” in main search, never Last used · pattern follows colour (Foundations › Card art) · chips and pills use min-height, so they grow at 200%", "wide"));
G.push(cmp("Recent (search)",
  st("Search open · empty query", `<div style="width:100%">${QC.p10.recent()}</div>`, "full") + st("Copied", `<div style="width:100%">${QC.p10.recent(QC.RECENT,{copied:"icici"})}</div>`, "full"),
  "last 3 copied cards, most recent first · group-label Recent · row 64: mini 40×26, bank + masked f3, type · holder f2 · copy disc 36 in 48 (in place: check on card hue + Copied, polite announcement, no snackbar) · row opens the card · hides once the query has text · search matches digits anywhere in the number, bank, holder, network, type, tag and note; results show only the last 4", "wide"));
