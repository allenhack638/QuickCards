# Builds, checks and publishes a signed APK whenever main changes.
#
# Pull requests run the check job only (tests, lint, offline guard); they never
# reach the release job or the signing secrets.
#
# A release is created only when app/build.gradle carries a versionName that
# has no tag yet (v<versionName>). Merges that do not bump the version still
# run every check but publish nothing.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    base64 of keystore/quickcards-release.jks
#   KEYSTORE_PASSWORD  storePassword from keystore.properties
#   KEY_ALIAS          keyAlias from keystore.properties
#   KEY_PASSWORD       keyPassword from keystore.properties
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and offline guard
        run: >
          ./gradlew --no-daemon
          :domain:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:verifyOfflineManifest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            domain/build/reports/

  release:
    name: Build and publish
    needs: check
    if: github.repository == 'allenhack638/QuickCards' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle | head -1)
          code=$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' app/build.gradle | head -1)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle"
            exit 1
          fi
          tag="v$name"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists; bump versionName and versionCode to publish a release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.publish == 'true'

      - name: Restore signing key
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing; see the header of this workflow."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/ci-release.jks
          {
            echo "storeFile=keystore/ci-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed APK
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature and permissions
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/QuickCards.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk"
          if "$tools/aapt" dump permissions "$apk" | grep -E "INTERNET|ACCESS_NETWORK_STATE|CAMERA"; then
            echo "::error::The release APK requests a forbidden permission."
            exit 1
          fi
          out="QuickCards-$VERSION_NAME.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$VERSION_TAG" \
            "QuickCards-$VERSION_NAME.apk" "QuickCards-$VERSION_NAME.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "QuickCards $VERSION_NAME" \
            --notes "Version $VERSION_NAME (build $VERSION_CODE). Offline: no internet or camera permission." \
            --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f keystore/ci-release.jks keystore.properties
