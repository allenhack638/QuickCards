plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.quickcards.app'
    compileSdk 36

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.quickcards.app"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "2.5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "SECURE_WINDOW", "false"
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField "boolean", "SECURE_WINDOW", "true"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            
            def apkName = "QuickCards"
            if (buildType == "debug") {
                apkName += "-debug"
            }
            apkName += ".apk"
            
            outputFileName = apkName
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    lint {
        disable += ["GradleDependency", "KaptUsageInsteadOfKsp"]
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

// Offline and camera-free check on the *merged* manifests, so no dependency can add a permission.
def mergedManifestFile = { variant ->
    file("${layout.buildDirectory.get().asFile}/intermediates/merged_manifest/${variant}/process${variant.substring(0, 1).toUpperCase() + variant.substring(1)}MainManifest/AndroidManifest.xml")
}

def verifyOfflineManifest = tasks.register("verifyOfflineManifest") {
    group = "verification"
    description = "Fails if the merged manifests contain network or camera capabilities."
    dependsOn "processDebugMainManifest", "processReleaseMainManifest"
    def manifests = [
        debug: mergedManifestFile("debug"),
        release: mergedManifestFile("release")
    ]
    inputs.files(manifests.values()).withPropertyName("mergedManifests")
    doLast {
        def forbidden = [
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.CAMERA",
            "com.google.android.datatransport"
        ]
        manifests.each { variant, manifest ->
            if (!manifest.isFile()) {
                throw new GradleException("Missing merged ${variant} manifest: ${manifest}")
            }
            def text = manifest.getText("UTF-8")
            forbidden.each { token ->
                if (text.contains(token)) {
                    throw new GradleException(
                        "Merged ${variant} manifest contains ${token}. Keep QuickCards offline."
                    )
                }
            }
        }
        logger.lifecycle("Offline manifest check passed for debug and release.")
    }
}

tasks.named("check").configure { dependsOn verifyOfflineManifest }

tasks.withType(Test).configureEach { test ->
    test.dependsOn "processDebugMainManifest", "processReleaseMainManifest"
    test.systemProperty "qc.mergedDebugManifest", mergedManifestFile("debug").absolutePath
    test.systemProperty "qc.mergedReleaseManifest", mergedManifestFile("release").absolutePath
}

dependencies {
    implementation project(':domain')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
    
    implementation 'androidx.biometric:biometric:1.1.0'
    
    implementation 'com.google.android.material:material:1.11.0'

    // Custom pass colour picker (Apache-2.0, pure Compose, no permissions)
    implementation 'com.github.skydoves:colorpicker-compose:1.1.2'
    
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    
    implementation 'com.google.code.gson:gson:2.10.1'

    // Play in-app updates: talks to the Play Store app over IPC, adds no permission
    implementation 'com.google.android.play:app-update:2.1.0'
    
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.kotest:kotest-property-jvm:5.9.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}